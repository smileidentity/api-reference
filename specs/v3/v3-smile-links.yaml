openapi: 3.0.3
servers:
  - url: https://testapi.smileidentity.com
    description: Sandbox
  - url: https://api.smileidentity.com
    description: Production
info:
  contact:
    name: Smile ID Support
    url: https://docs.usesmileid.com
    email: support@usesmileid.com
  title: V3 Smile Links API
  version: 1.0.0
  description: |
    Create, fetch, update, and list Smile Links — unique URLs a partner hands
    to end users; opening a link runs a pre-configured verification flow and
    creates a job for the partner.

    Links created via this API are v3 links: they are referenced by an id
    (`ref_id`, a uuid), their URLs have the shape
    `https://links.usesmileid.com/v3/{partnerId}/{refId}`, and opening them
    runs the v3 hosted web integration.

    All operations — create, fetch, update, and list — are synchronous and
    return the result directly in the response.

    **Authentication**: JWT token auth via the `SmileID-Token` header
    (obtained from `POST /v3/token`). The token must be unscoped — a token
    carrying a `product` claim is rejected with the standard authentication
    error (`401`). The request IP must also pass the partner's IP allowlist
    (when configured) and must not appear on the IP blocklist.
components:
  securitySchemes:
    SmileIDToken:
      type: apiKey
      in: header
      name: SmileID-Token
      description: JWT token obtained from `POST /v3/token`.
      x-gitbook-token-placeholder: YOUR_GENERATED_TOKEN
  schemas:
    SmileLinkIdType:
      type: object
      required:
        - country
        - id_type
        - verification_method
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        id_type:
          type: string
          description: The ID type to verify.
          example: NIN
        verification_method:
          type: string
          description: The verification product to run for this ID type.
          example: enhanced_kyc
      additionalProperties: false
    SmileLinkResource:
      type: object
      required:
        - ref_id
        - link
        - name
      properties:
        ref_id:
          type: string
          format: uuid
          description: The link's id — the reference used on all v3 smile_links routes.
          example: 65983864-e8c6-4d09-890a-2e5f88fc50f6
        link:
          type: string
          description: The URL to hand to the end user.
          example: https://links.usesmileid.com/v3/2/65983864-e8c6-4d09-890a-2e5f88fc50f6
        name:
          type: string
          example: Onboarding
        company_name:
          type: string
          description: The company name the link shows end users — an approved alternative display name if one was chosen at creation, otherwise the company's own name.
          example: Acme Pay
        description:
          type: string
          nullable: true
        id_types:
          type: array
          items:
            $ref: '#/components/schemas/SmileLinkIdType'
        is_single_use:
          type: boolean
        callback_url:
          type: string
          description: Where job results for this link are delivered.
        notice_privacy_policy_url:
          type: string
        logo_url:
          type: string
        redirect_url:
          type: string
          nullable: true
        theme_color:
          type: string
          example: '#000'
        expires_at:
          type: string
          format: date-time
          nullable: true
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the link is disabled; null when active.
        partner_params:
          type: object
          nullable: true
        user_id:
          type: string
          nullable: true
          description: |
            The user id a single-use link's job runs under (generated when not
            provided). Null on multi-use links — each opener gets its own user
            id at link-open.
        token_provided_fields:
          type: array
          description: >-
            Field names bound onto this link from the creating SmileID-Token's payload. Sorted. The hosted flow that opens the link skips collecting these from the end user; empty when the link was created without a bound token payload.
          items:
            type: string
            enum:
              - consent
              - country
              - email
              - given_names
              - id_number
              - id_type
              - last_name
              - phone_number
          example: [country, id_type]
        token_provided_values:
          type: object
          description: >-
            Values for the subset of token_provided_fields held in the clear (country, id_type, consent). PII fields are never returned here — the token holds opaque pii_-prefixed references to them, not the values. Empty object when nothing is bound.
          properties:
            country:
              type: string
              example: NG
            id_type:
              type: string
              example: NIN
            consent:
              type: object
              description: >-
                The consent record bound from the token. Present only when consent is bound, and complete when present.
              required:
                - granted
                - granted_at
                - notice_language
                - notice_privacy_policy_url
              properties:
                granted:
                  type: boolean
                  example: true
                granted_at:
                  type: string
                  format: date-time
                  example: '2026-01-01T09:00:00.000Z'
                notice_language:
                  type: string
                  example: EN
                notice_privacy_policy_url:
                  type: string
                  format: uri
                  example: https://example.com/privacy-policy
          example:
            country: NG
            id_type: NIN
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
    SmileLinkCreated:
      type: object
      required:
        - link
        - message
        - ref_id
        - user_id
      properties:
        link:
          type: string
          description: The URL to hand to the end user.
          example: https://links.usesmileid.com/v3/2/65983864-e8c6-4d09-890a-2e5f88fc50f6
        message:
          type: string
          example: Smile Link created
        ref_id:
          type: string
          format: uuid
          description: The link's id — the reference used on all v3 smile_links routes.
          example: 65983864-e8c6-4d09-890a-2e5f88fc50f6
        user_id:
          type: string
          nullable: true
          description: |
            The user id a single-use link's job runs under (generated when not
            provided). Null on multi-use links — each opener gets its own user
            id at link-open.
      additionalProperties: false
    SmileLinkJobStats:
      type: object
      description: |
        Outcome counts for the jobs run against a link. Each completed job is
        counted once under its final state (`clear`, `block`, `attention` or
        `error`); the `*_jobs` fields are derived from those four. Jobs still
        processing are not counted in any field.
      required:
        - attention
        - block
        - clear
        - error
        - failed_jobs
        - successful_jobs
        - total_jobs
      properties:
        clear:
          type: integer
          description: Jobs that resolved clear.
        block:
          type: integer
          description: Jobs that resolved block.
        attention:
          type: integer
          description: Jobs that resolved attention (completed, flagged for review).
        error:
          type: integer
          description: Jobs that ended in an error.
        successful_jobs:
          type: integer
          description: clear + attention.
        failed_jobs:
          type: integer
          description: block + error.
        total_jobs:
          type: integer
          description: clear + block + attention + error.
    SmileLinkListItem:
      allOf:
        - $ref: '#/components/schemas/SmileLinkResource'
        - $ref: '#/components/schemas/SmileLinkJobStats'
    SmileLinkListMeta:
      type: object
      required:
        - current_page
        - limit
        - total_count
        - total_pages
      properties:
        current_page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total_count:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 3
    SmileLinkListResponse:
      type: object
      required:
        - links
        - meta
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/SmileLinkListItem'
        meta:
          $ref: '#/components/schemas/SmileLinkListMeta'
    ApiErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: HTTP status text.
          example: Bad Request
        message:
          type: string
          description: Human-readable error message.
          example: Invalid request.
security:
  - SmileIDToken: []
tags:
  - name: Smile Links
paths:
  /v3/smile_links:
    post:
      operationId: createSmileLink
      tags:
        - Smile Links
      summary: Create a Smile Link
      description: |
        Creates a Smile Link synchronously and returns a creation
        acknowledgment with the link's id (`ref_id`) and the URL to hand to
        the end user. The full link resource is available from
        `GET /v3/smile_links/{refId}`.

        When the `SmileID-Token` header carries a payload (bound at
        `POST /v3/token`), that payload is copied onto the link being
        created — only single-use links accept a bound payload. The fields
        it carries are surfaced as `token_provided_fields` /
        `token_provided_values` on the link resource, and the hosted flow
        that opens the link skips collecting them from the end user. If the
        request body omits `user_id` and the token carries one, the link's
        `user_id` defaults to it. The token's `callback_url` claim is never
        used for the link — only the link's own `callback_url` (request
        body or partner default) applies.

        A bound `country` and/or `id_type` overrides what the end user
        selects when they open the link, so each one the payload carries
        must be offered by at least one of the link's `id_types`. The bound
        payload is fixed at creation and cannot be changed by
        `PUT /v3/smile_links/{refId}`.
      security:
        - SmileIDToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - id_types
                - name
                - notice_privacy_policy_url
                - is_single_use
              properties:
                id_types:
                  type: array
                  minItems: 1
                  description: JSON-encoded array of verification configurations.
                  items:
                    $ref: '#/components/schemas/SmileLinkIdType'
                name:
                  type: string
                  example: Onboarding
                company_name:
                  type: string
                  maxLength: 255
                  description: The company name the link shows end users. Omit it to show the company's own name; otherwise it must match, exactly, the company name or one of the alternative display names Smile ID has approved for the company. It cannot be changed after the link is created.
                  example: Acme Pay
                notice_privacy_policy_url:
                  type: string
                  example: https://partner.example/privacy
                  description: Must be a public HTTPS URL. Private, loopback, link-local and internal addresses are rejected.
                is_single_use:
                  type: boolean
                callback_url:
                  type: string
                  description: Defaults to the partner's configured callback when omitted; if there is none, the request is rejected with 400. Otherwise a public HTTPS URL; private, loopback, link-local and internal addresses are rejected.
                description:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                  description: Defaults to 90 days from creation for single-use links.
                logo_url:
                  type: string
                  description: Must be a public HTTPS URL. Private, loopback, link-local and internal addresses are rejected.
                redirect_url:
                  type: string
                  description: Must be a public HTTPS URL. Private, loopback, link-local and internal addresses are rejected.
                theme_color:
                  type: string
                  maxLength: 32
                  pattern: '^(#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|(rgb|hsl)a?\([0-9., %/]+\)|[a-zA-Z]{3,30})$'
                  description: 'A hex colour such as #0a0a0a, an rgb() or hsl() value, or a colour name.'
                partner_params:
                  type: object
                  description: JSON-encoded key-value pairs echoed on job results.
                user_id:
                  type: string
                  description: |
                    Unique user id for a single-use link's job. Defaults to
                    the SmileID-Token's user id when omitted and the token
                    carries one; otherwise generated (`user_` TypeID). Must
                    not already be in use by another link.
            encoding:
              id_types:
                contentType: application/json
              partner_params:
                contentType: application/json
            examples:
              multiUse:
                summary: Reusable link
                value:
                  id_types: [{country: NG, id_type: NIN, verification_method: enhanced_kyc}]
                  name: Onboarding
                  notice_privacy_policy_url: https://partner.example/privacy
                  is_single_use: false
              singleUse:
                summary: Single-use link for one person
                value:
                  id_types: [{country: NG, id_type: NIN, verification_method: biometric_kyc}]
                  name: KYC for Ada
                  notice_privacy_policy_url: https://partner.example/privacy
                  is_single_use: true
                  user_id: user-123
      responses:
        '201':
          description: |
            Link created. The body is a creation acknowledgment — a superset of
            the legacy v2 create body's `link`/`ref_id` keys. Fetch the full
            link resource via `GET /v3/smile_links/{refId}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmileLinkCreated'
        '400':
          description: |
            Validation error. Possible causes:
            - A required field (`id_types`, `name`, `notice_privacy_policy_url`,
              `is_single_use`) is missing or invalid.
            - An id_type/verification_method is not supported or not enabled
              on the account.
            - The `SmileID-Token` carries a payload but `is_single_use` is
              `false`.
            - The `SmileID-Token` payload's `country` and/or `id_type` is
              not offered by any of the link's `id_types`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingName:
                  summary: Missing required field
                  value:
                    message: "Required field 'name' is missing or invalid."
                    status: Bad Request
                payloadNotSingleUse:
                  summary: Token payload bound but the link is not single-use
                  value:
                    message: A token payload can only be bound to a single-use link.
                    status: Bad Request
                payloadIdTypeMismatch:
                  summary: Token payload's country/id_type not among the link's id_types
                  value:
                    message: The token's country/id_type must match one of the link's id_types.
                    status: Bad Request
        '401':
          description: Authentication failed (missing, invalid, or product-scoped token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Missing or invalid authentication credentials.
                status: Unauthorized
        '403':
          description: |
            Access denied. Possible causes:
            - Production is not enabled for the account.
            - IP address is on the blocklist or not in the partner's allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: You are not authorized to do that.
                status: Forbidden
        '409':
          description: The provided `user_id` is already in use by another link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: User ID is taken. Please provide a unique ID.
                status: Conflict
        '415':
          description: |
            Wrong or missing `Content-Type` header. The request body must be
            sent as `multipart/form-data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
                status: Unsupported Media Type
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: An unexpected error occurred. Please try again or contact support.
                status: Internal Server Error
    get:
      operationId: listSmileLinks
      tags:
        - Smile Links
      summary: List Smile Links
      description: |
        Returns a paginated listing of the authenticated partner's v3 Smile
        Links, newest first, each with per-link job outcome stats. Links
        created through the v2 API are not included; they remain on the v2
        listing endpoint.
      security:
        - SmileIDToken: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: page
          in: query
          required: false
          description: Page number, 1-indexed. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: single_use
          in: query
          required: false
          description: Filter to single-use links (`true`) or reusable links (`false`). Omit to return both.
          schema:
            type: boolean
      responses:
        '200':
          description: The paginated listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmileLinkListResponse'
              example:
                links:
                  - ref_id: 65983864-e8c6-4d09-890a-2e5f88fc50f6
                    link: https://links.usesmileid.com/v3/2/65983864-e8c6-4d09-890a-2e5f88fc50f6
                    name: Onboarding
                    description: null
                    id_types: [{country: NG, id_type: NIN, verification_method: enhanced_kyc}]
                    is_single_use: false
                    callback_url: https://partner.example/callback
                    notice_privacy_policy_url: https://partner.example/privacy
                    logo_url: https://portal.usesmileid.com/logo-black-horizontal.png
                    redirect_url: null
                    theme_color: '#000'
                    expires_at: null
                    disabled_at: null
                    partner_params: null
                    user_id: null
                    created_at: '2024-01-15T10:30:00Z'
                    updated_at: '2024-01-20T08:15:00Z'
                    clear: 12
                    block: 1
                    attention: 2
                    error: 0
                    successful_jobs: 14
                    failed_jobs: 1
                    total_jobs: 15
                meta:
                  current_page: 1
                  limit: 20
                  total_count: 1
                  total_pages: 1
        '400':
          description: Validation error — `limit`, `page`, or `single_use` is out of range or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                invalidLimit:
                  summary: limit out of range
                  value:
                    message: "Query parameter 'limit' must be an integer between 1 and 100."
                    status: Bad Request
        '401':
          description: Authentication failed (missing, invalid, or product-scoped token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Missing or invalid authentication credentials.
                status: Unauthorized
        '403':
          description: |
            Access denied. Possible causes:
            - IP address is on the blocklist or not in the partner's allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: You are not authorized to do that.
                status: Forbidden
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: An unexpected error occurred. Please try again or contact support.
                status: Internal Server Error
  /v3/smile_links/{refId}:
    get:
      operationId: getSmileLink
      tags:
        - Smile Links
      summary: Fetch a Smile Link
      description: |
        Returns the link resource for a link id.
      security:
        - SmileIDToken: []
      parameters:
        - name: refId
          in: path
          required: true
          description: The link's id, returned as `ref_id` at creation.
          schema:
            type: string
            format: uuid
          example: 65983864-e8c6-4d09-890a-2e5f88fc50f6
      responses:
        '200':
          description: The link resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmileLinkResource'
        '400':
          description: '`refId` is not a valid link id (uuid).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: refId must be a valid link id
                status: Bad Request
        '401':
          description: Authentication failed (missing, invalid, or product-scoped token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Missing or invalid authentication credentials.
                status: Unauthorized
        '403':
          description: The request IP is not in the partner's allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: You are not authorized to do that.
                status: Forbidden
        '404':
          description: No link with this `refId` exists for the authenticated partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Link not found
                status: Not Found
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: An unexpected error occurred. Please try again or contact support.
                status: Internal Server Error
    put:
      operationId: updateSmileLink
      tags:
        - Smile Links
      summary: Update a Smile Link
      description: |
        Applies a partial update to a Smile Link's `id_types` and/or
        `is_disabled` and returns the full, updated link resource.

        These are the only mutable fields. Everything else on a link,
        including `expires_at`, `is_single_use`, `user_id`, the URLs and the
        bound token payload, is fixed at creation. Any payload on this
        request's `SmileID-Token` is ignored.

        When a single-use link carries a bound payload with a `country`
        and/or `id_type`, the new `id_types` must still offer each of them,
        since they override what the end user selects when opening the link.
      security:
        - SmileIDToken: []
      parameters:
        - name: refId
          in: path
          required: true
          description: The link's id, returned as `ref_id` at creation.
          schema:
            type: string
            format: uuid
          example: 65983864-e8c6-4d09-890a-2e5f88fc50f6
      requestBody:
        required: true
        description: |
          At least one of `id_types` or `is_disabled` is required; either may
          be sent alone.
        content:
          multipart/form-data:
            schema:
              type: object
              minProperties: 1
              properties:
                id_types:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: JSON-encoded array of verification configurations, replacing the link's current `id_types`.
                  items:
                    $ref: '#/components/schemas/SmileLinkIdType'
                is_disabled:
                  type: boolean
                  description: Disables (`true`) or re-enables (`false`) the link.
            encoding:
              id_types:
                contentType: application/json
            examples:
              disable:
                summary: Disable a link
                value:
                  is_disabled: true
              replaceIdTypes:
                summary: Replace the link's id_types
                value:
                  id_types: [{country: NG, id_type: NIN, verification_method: enhanced_kyc}]
      responses:
        '200':
          description: The updated link resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmileLinkResource'
        '400':
          description: |
            Validation error. Possible causes:
            - Neither `id_types` nor `is_disabled` was provided, or a provided value is malformed.
            - An id_type/verification_method is not supported or not enabled on the account.
            - The new `id_types` no longer offer the bound token payload's
              `country` and/or `id_type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingFields:
                  summary: Neither field provided
                  value:
                    message: "Provide at least one of 'id_types' or 'is_disabled'."
                    status: Bad Request
                payloadIdTypeMismatch:
                  summary: New id_types drop the bound payload's country/id_type
                  value:
                    message: The token's country/id_type must match one of the link's id_types.
                    status: Bad Request
        '401':
          description: Authentication failed (missing, invalid, or product-scoped token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Missing or invalid authentication credentials.
                status: Unauthorized
        '403':
          description: |
            Access denied. Possible causes:
            - Production is not enabled for the account.
            - IP address is on the blocklist or not in the partner's allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: You are not authorized to do that.
                status: Forbidden
        '404':
          description: No link with this `refId` exists for the authenticated partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Link not found
                status: Not Found
        '409':
          description: |
            The link is single-use and has already been used. `id_types` can
            no longer change; `is_disabled` alone is still accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: This link has already been used; its id_types can no longer change.
                status: Conflict
        '410':
          description: The link has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: The link has expired.
                status: Gone
        '415':
          description: |
            Wrong or missing `Content-Type` header. The request body must be
            sent as `multipart/form-data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
                status: Unsupported Media Type
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: An unexpected error occurred. Please try again or contact support.
                status: Internal Server Error
