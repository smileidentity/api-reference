      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        name:
          type: string
          description: Country name.
          example: Nigeria
        continent:
          type: string
          description: Continent name.
          example: AFRICA
    IDType:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable ID type code.
          example: DRIVERS_LICENSE
        name:
          type: string
          description: Human-readable name of the ID type.
          example: Driver's License
        example:
          type: array
          items:
            type: string
          description: Example ID numbers or usage hints.
        has_back:
          type: boolean
          description: Whether this document type has a back side that should be captured.
          example: true
    SupportedDocument:
