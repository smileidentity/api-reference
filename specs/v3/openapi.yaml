    AmlMonitoringRequest:
      type: object
      required:
        - countries
        - user_details
        - consent
      properties:
        countries:
          type: array
          minItems: 1
          description: >-
            ISO 3166-1 alpha-2 country codes (uppercase) to screen against. Send as a JSON-encoded
            string in the multipart body, e.g. '["NG","GH"]'.
          items:
            type: string
            minLength: 2
            maxLength: 2
            example: NG
        full_name:
          type: string
          minLength: 1
          description: >-
            Full name of the individual to screen. Required unless `search_existing_user` is true,
            in which case the name is resolved from the user's prior KYC enrollment.
          example: Jane Doe
        birth_year:
          type: string
          pattern: ^\d{4}$
          nullable: true
          description: Optional four-digit birth year used to narrow the screening.
          example: '1990'
        strict_match:
          type: boolean
          default: true
          description: >-
            When true (default) a higher match threshold is used, returning fewer, more precise
            matches. When false a broader threshold is used.
          example: true
        aliases:
          type: array
          maxItems: 20
          description: >-
            Optional alternate names / spellings to screen alongside full_name. Send as a
            JSON-encoded string in the multipart body, e.g. '["Jane A. Doe","J. Doe"]'.
          items:
            type: string
            minLength: 1
            maxLength: 256
            example: J. Doe
        search_existing_user:
          type: boolean
          description: >-
            When set, reuses the name (and birth year) from the user's prior Biometric KYC or
            Document Verification enrollment. Requires `user_id` (or the User-ID header), and that
            user must be an enrollee of this partner with a prior KYC record carrying a usable name
            and country — otherwise the request is rejected with a 404.
          example: false
        user_id:
          type: string
          description: >-
            Partner-provided user identifier. Optional, but required in the body when
            `search_existing_user` is true; the User-ID header and token only have to agree with it.
          example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required:
                - email
            - required:
                - phone_number
          description: Consumer-stated PII fields for the user. Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              description: Given names of the individual.
              example: Jane
            last_name:
              type: string
              minLength: 1
              description: Last name / surname of the individual.
              example: Doe
            email:
              type: string
              format: email
              nullable: true
              description: Email address. At least one of email or phone_number is required.
              example: jane@example.com
            phone_number:
              type: string
              pattern: ^\+[1-9]\d{6,14}$
              nullable: true
              description: >-
                Phone number in E.164 format (must start with +). At least one of email or
                phone_number is required.
              example: '+2348012345678'
        consent:
          $ref: '#/components/schemas/Consent'
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted. Must
            be on the partner's allowed callback domains list. Can be provided via the token payload
            (bound at /v3/token) instead of the request body.
