  /v3/services/supported_documents:
    get:
      operationId: getSupportedDocuments
      tags:
        - Services
      summary: List supported documents for verification
      description: |
        Returns a list of supported document types for identity verification across all
        countries served by Smile Identity.

        The response can be filtered by continent or country code. An optional `locale`
        parameter controls the language of document names.

        This endpoint does not require authentication. It is an alias of
        `GET /v1/valid_documents` and `GET /v3/valid-documents`.
      security: []
      parameters:
        - name: continent
          in: query
          required: false
          description: Filter results to a single continent.
          schema:
            type: string
            enum:
              - AFRICA
              - ASIA
              - EUROPE
              - NORTH AMERICA
              - OCEANIA
              - SOUTH AMERICA
          example: AFRICA
        - name: country_code
          in: query
          required: false
          description: |
            Filter results to a single country. Must be an ISO 3166-1 alpha-2 code
            (two uppercase letters).
          schema:
            type: string
            pattern: ^[A-Z]{2}$
          example: NG
        - name: locale
          in: query
          required: false
          description: |
            Locale for document names. Defaults to `en-GB`.
            Supported values: `en-GB`, `fr-FR`, `ar-EG`.
          schema:
            type: string
            default: en-GB
            enum:
              - en-GB
              - fr-FR
              - ar-EG
      responses:
        '200':
          description: List of supported documents, optionally filtered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedDocumentsResponse'
              example:
                valid_documents:
                  - country:
                      code: NG
                      name: Nigeria
                      continent: AFRICA
                    id_types:
                      - code: DRIVERS_LICENSE
                        name: Driver's License
                        example:
                          - AAA00000AA00
                        has_back: true
                      - code: NATIONAL_ID
                        name: National ID (NIN Slip)
                        example:
                          - '00000000000'
                        has_back: false
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
              example:
                error: >-
                  Country Code must be a valid ISO 3166-1 alpha-2 country code consisting of exactly
                  two uppercase letters.
                code: '2413'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
              example:
                error: System Error
                code: '2401'
  /v3/services/id_status:
    get:
      operationId: getIdStatus
      tags:
        - Services
      summary: Get ID type availability status
      description: |
        Returns the current availability and success rate for a specific ID type
        in a given country, based on uptime data from the last hour.

        Requires authentication via JWT token.
      security:
        - SmileIDToken: []
      parameters:
        - name: country
          in: query
          required: true
          description: ISO 3166-1 alpha-2 country code or full country name (e.g. "NG" or "Nigeria").
          schema:
            type: string
            example: NG
        - name: id_type
          in: query
          required: true
          description: The ID type code to check status for (e.g. "BVN", "NIN", "VOTER_ID").
          schema:
            type: string
            example: BVN
      responses:
        '200':
          description: ID status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStatusResponse'
              example:
                last_checked: '2026-04-14T12:30:00.000Z'
                last_check_status: success
                last_hour_success_rate: 95%
                last_known_status: online
                last_check_success_rate: 90%
        '400':
          description: Bad request – missing or invalid parameters, or no uptime data found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStatusErrorResponse'
              examples:
                missingCountry:
                  summary: Country parameter missing
                  value:
                    message: '"country" is required'
                    status: Bad Request
                invalidCountry:
                  summary: Invalid country value
                  value:
                    message: Invalid country
                    status: Bad Request
                invalidIdType:
                  summary: ID type not valid for country
                  value:
                    message: Invalid id_type for the given country
                    status: Bad Request
                noData:
                  summary: No uptime data in the last hour
                  value:
                    message: No data found. Check that NG and BVN are valid inputs
                    status: Bad Request
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStatusErrorResponse'
              example:
                message: Invalid token
                status: Unauthorized
  /v3/compare:
    post:
      summary: Submit smart selfie compare
      operationId: v3SmartSelfieCompare
      tags:
        - Smart Selfie Compare
      security:
        - SmileIDToken: []
      description: >-
        Compares a selfie image against a provided comparison image (document, ID photo, or
        portrait). The images are uploaded, validated at entry, then queued for async ML processing
        (passive liveness, face matching, optional active liveness with liveness images). Results
        are delivered via callback URL.

        If `user_id` is provided and the comparison passes, the user will be enrolled.
      parameters:
        - name: SmileID-Source-SDK
          in: header
          required: false
          description: Source SDK identifier.
          schema:
            type: string
            example: ios
        - name: SmileID-Source-SDK-Version
          in: header
          required: false
          description: Source SDK version.
          schema:
            type: string
            example: 10.3.1
        - name: SmileID-Timestamp
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: ISO 8601 timestamp used as the salt when computing SmileID-Request-Signature.
          schema:
            type: string
            format: date-time
        - name: SmileID-Request-Signature
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: HMAC signature of the raw HTTP request body.
          schema:
            type: string
        - name: User-ID
          in: header
          required: false
          description: Partner-provided user identifier. If omitted, a TypeID is generated automatically.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SmartSelfieCompareRequest'
            encoding:
              selfie_image:
                contentType: image/jpeg
              comparison_image:
                contentType: image/jpeg
              liveness_images:
                contentType: image/jpeg
      responses:
        '202':
          description: Accepted — job queued for async processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              example:
                status: accepted
                message: Request accepted and queued for processing.
                job_id: job_01h8x9y2z3a4b5c6d7e8f9g0h1
                user_id: user_01h8x9y2z3a4b5c6d7e8f9g0h1
                created_at: '2026-03-10T12:00:00.000Z'
        '400':
          description: Bad Request — validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingCallbackUrl:
                  summary: Missing callback_url and no default set
                  value:
                    status: Bad Request
                    message: >-
                      A valid callback_url is required in the request or a default callback URL must
                      be configured in the portal.
                missingSelfie:
                  summary: Missing selfie image
                  value:
                    status: Bad Request
                    message: Required field 'selfie_image' is missing or invalid.
                missingComparisonImage:
                  summary: Missing comparison image
                  value:
                    status: Bad Request
                    message: Required field 'comparison_image' is missing or invalid.
                invalidComparisonType:
                  summary: Invalid comparison image type
                  value:
                    status: Bad Request
                    message: Field 'comparison_image_type' must be either DOCUMENT, ID_PHOTO, or PORTRAIT.
                missingContact:
                  summary: Missing email and phone
                  value:
                    status: Bad Request
                    message: Either email or phone_number is required.
        '401':
          description: Unauthorized — invalid or missing authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '402':
          description: Payment Required — insufficient wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden — partner not authorized for this product or IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '415':
          description: Unsupported Media Type — request must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too Many Requests — rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /v3/token:
    post:
      operationId: getV3Token
      tags:
        - Authentication
      summary: Generate v3 Auth Token
      description: Issues a short-lived JWT for authenticating subsequent v3 API requests.
      parameters:
        - name: smileid-partner-id
          in: header
          required: true
          description: Your unique partner identifier. Must be numeric with no leading zeros.
          schema:
            type: string
            pattern: ^[1-9]\d*$
            example: '1234'
        - name: smileid-api-key
          in: header
          required: true
          description: Your partner API key for authentication.
          schema:
            type: string
            example: abcd1234key
      requestBody:
        description: Optional parameters to be included in the generated token.
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Optional partner-provided user identifier.
                partner_params:
                  type: object
                  additionalProperties:
                    type: string
                  description: Key-value metadata for partner reference.
                  example:
                    pi: '3.14159265359'
                product:
                  type: string
                  description: The product or service the token will be used for.
                  enum:
                    - aml
                    - basic_kyc
                    - one_time_aml
                    - biometric_kyc
                    - address_verification
                    - document_verification
                    - enhanced_document_verification
                    - enhanced_kyc
                    - phone_number_verification
                    - smart_selfie_authentication
                    - smart_selfie_registration
                    - smart_selfie_compare
                  example: smart_selfie_authentication
                payload:
                  type: object
                  description: >-
                    Optional identity fields to bind into the token. PII fields (id_number,
                    given_names, last_name, email, phone_number) are validated as plaintext, then
                    tokenized via the PII vault — the issued JWT carries opaque `pii_`-prefixed
                    vault token ids, never raw PII. country and id_type stay plaintext in the claim,
                    and callback_url is replaced by a resolvable `callback_`-prefixed id. Downstream
                    v3 endpoints inject these fields server-side, overriding any matching fields in
                    the request body, so identity data bound to the token cannot be altered by the
                    client. Fields provided here make the corresponding request body fields optional
                    on downstream endpoints; GET /v3/services/config lists them as
                    `token_provided_fields`.
                  properties:
                    country:
                      type: string
                      description: >-
                        Country code or name. Accepts ISO 3166-1 alpha-2 codes (e.g. "NG") or full
                        country names (e.g. "Nigeria"). Normalized to uppercase ISO 3166-1 alpha-2
                        on the server. If id_type is also provided, the country/id_type combination
                        is validated.
                      example: NG
                    id_type:
                      type: string
                      description: >-
                        ID document type (e.g., NIN, BVN, DRIVERS_LICENSE). If country is also
                        provided, the combination is validated against known ID types.
                      example: NIN
                    id_number:
                      type: string
                      description: >-
                        ID document number. If country and id_type are also provided, the format is
                        validated against the expected regex pattern.
                      example: '12345678901'
                    given_names:
                      type: string
                      description: Given name(s) / first name of the individual.
                      example: John
                    last_name:
                      type: string
                      description: Last name / surname of the individual.
                      example: Doe
                    email:
                      type: string
                      format: email
                      description: Email address of the individual.
                      example: john@example.com
                    phone_number:
                      type: string
                      description: Phone number in E.164 format.
                      example: '+2348012345678'
                    callback_url:
                      type: string
                      description: >-
                        URL to receive the async result callback, or a `callback_`-prefixed id from
                        a previously issued token. Overrides the callback_url in the request body of
                        downstream endpoints.
                      example: https://example.com/callback
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for authenticating subsequent v3 API requests.
                    example: ey...
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Bad Request
                message: smileid-partner-id header is required.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unauthorized
                message: Invalid authentication credentials.
        '415':
          description: Unsupported Media Type — request body, if provided, must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unsupported Media Type
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Internal Server Error
                message: An unexpected error occurred. Please try again or contact support.
  /v3/status/{jobId}:
    get:
      operationId: getVerificationStatus
      tags:
        - Verification Status
      security:
        - SmileIDToken: []
      summary: Get verification status
      description: >-
        Retrieves the current status of a previously submitted verification. Returns the latest
        state from the verification lifecycle (processing, clear, block, attention, error).
      parameters:
        - name: jobId
          in: path
          required: true
          description: TypeID format verification identifier with 'job_' prefix.
          schema:
            type: string
            pattern: ^job_[0-9a-hjkmnp-tv-z]{26}$
            example: job_01h2xcejqtf2nbrexx3vqjhp41
      responses:
        '200':
          description: Verification has reached a terminal state (clear, block, attention, or error).
          headers:
            api_version:
              $ref: '#/components/headers/ApiVersion'
            job_id:
              $ref: '#/components/headers/JobId'
            user_id:
              $ref: '#/components/headers/UserId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
              example:
                status: clear
                job_id: job_01h2xcejqtf2nbrexx3vqjhp41
                user_id: user_01h8x9y2z3a4b5c6d7e8f9g0h1
                message: Job completed
                created_at: '2026-07-07T12:34:56.000Z'
        '202':
          description: Verification is still processing.
          headers:
            api_version:
              $ref: '#/components/headers/ApiVersion'
            job_id:
              $ref: '#/components/headers/JobId'
            user_id:
              $ref: '#/components/headers/UserId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
              example:
                status: processing
                job_id: job_01h2xcejqtf2nbrexx3vqjhp41
                user_id: user_01h8x9y2z3a4b5c6d7e8f9g0h1
                message: Job is still processing
                created_at: '2026-07-07T12:34:56.000Z'
        '400':
          description: Bad Request — invalid jobId format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Bad Request
                message: '"jobId" must be a valid TypeID with prefix ''job_'''
        '401':
          description: Unauthorized — invalid or missing authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unauthorized
                message: Invalid authentication credentials.
        '403':
          description: Forbidden — IP not in allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Forbidden
                message: You are not authorized to do that.
        '404':
          description: Not Found — verification does not exist or does not belong to this partner.
          headers:
            api_version:
              $ref: '#/components/headers/ApiVersion'
            job_id:
              $ref: '#/components/headers/JobId'
            user_id:
              $ref: '#/components/headers/UserId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
              example:
                status: not_found
                job_id: job_01h2xcejqtf2nbrexx3vqjhp41
                user_id: unknown
                message: Job not found
                created_at: '2026-07-07T12:34:56.000Z'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Internal Server Error
                message: An unexpected error occurred. Please try again or contact support.
components:
  headers:
    ApiVersion:
      description: Deployed API version that served the response.
      schema:
        type: string
        example: v3.640.0
    JobId:
      description: TypeID format verification identifier.
      schema:
        type: string
        example: job_01h2xcejqtf2nbrexx3vqjhp41
    UserId:
      description: User ID associated with the verification ('unknown' when not found).
      schema:
        type: string
        example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
  parameters:
    CountryFilter:
      name: country
      in: query
      required: false
      description: |
        ISO 3166-1 alpha-2 country code (two uppercase letters). When provided, only
        items matching this country are returned. When omitted, all items are returned.
      schema:
        type: string
        pattern: ^[A-Z]{2}$
        example: NG
  requestBodies: {}
  responses: {}
  schemas:
    BiometricAuthenticationRequest:
      type: object
      required:
        - user_id
        - consent
        - user_details
      anyOf:
        - required:
            - selfie_image
            - liveness_images
        - required:
            - use_enrolled_image
          properties:
            use_enrolled_image:
              type: boolean
              enum:
                - true
      properties:
        user_id:
          type: string
          description: The enrolled user's identifier. Must match an existing enrollee.
          example: user_auth_001
        selfie_image:
          type: string
          format: binary
          description: JPEG selfie image for authentication. Required unless use_enrolled_image is true.
        liveness_images:
          type: array
          minItems: 6
          maxItems: 8
          items:
            type: string
            format: binary
          description: Array of JPEG liveness images. Required unless use_enrolled_image is true.
        consent:
          $ref: '#/components/schemas/Consent'
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required:
                - email
            - required:
                - phone_number
          description: Consumer-stated PII fields for the user. Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              example: Jane
            last_name:
              type: string
              minLength: 1
              example: Smith
            email:
              type: string
              format: email
              nullable: true
              description: At least one of email or phone_number is required.
              example: jane@example.com
            phone_number:
              type: string
              pattern: ^\+[1-9]\d{6,14}$
              nullable: true
              description: Phone number in E.164 format. At least one of email or phone_number is required.
              example: '+2348012345678'
        use_enrolled_image:
          type: boolean
          default: false
          description: >-
            If true, skips selfie and liveness image upload and uses the enrolled image for
            re-verification. Useful for server-side re-authentication.
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: URL to receive the async result callback.
          example: https://example.com/callback
        sandbox_result:
          type: number
          description: Force a specific result code in sandbox mode.
        partner_params:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
    Consent:
      type: object
      required:
        - granted
        - granted_at
        - notice_language
        - notice_privacy_policy_url
      properties:
        granted:
          type: boolean
          enum:
            - true
          description: Must be true; user has granted consent.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when consent was granted.
          example: '2026-03-06T12:00:00.000Z'
        notice_language:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: ISO 639-1 language code of the privacy notice shown, uppercase.
          example: EN
        notice_privacy_policy_url:
          type: string
          format: uri
          pattern: ^https://
          description: HTTPS URL of the privacy policy notice shown to the user.
          example: https://example.com/privacy
    AcceptedResponse:
      type: object
      required:
        - status
        - message
        - job_id
        - user_id
        - created_at
      properties:
        status:
          type: string
          enum:
            - accepted
          description: Acceptance status for queued verification requests.
        message:
          type: string
          description: Human-readable acceptance message.
          example: Request accepted and queued for processing.
        job_id:
          type: string
          description: TypeID format verification identifier for tracking.
          example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
        user_id:
          type: string
          description: TypeID format user identifier, or partner-provided user identifier.
          example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the verification was created.
          example: '2026-03-10T12:00:00.000Z'
    ApiErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: HTTP status text.
          example: Bad Request
        message:
          type: string
          description: Human-readable error message.
          example: Invalid request.
    BiometricEnrollmentRequest:
      type: object
      required:
        - selfie_image
        - liveness_images
        - consent
        - user_details
      properties:
        selfie_image:
          type: string
          format: binary
          description: >-
            JPEG selfie image used as the enrollment reference photo. Must be a clear, well-lit,
            front-facing photo.
        liveness_images:
          type: array
          minItems: 6
          maxItems: 8
          items:
            type: string
            format: binary
          description: >-
            Array of JPEG liveness sequence images captured during the liveness check. These images
            are used for passive and active liveness verification.
        consent:
          $ref: '#/components/schemas/Consent'
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required:
                - email
            - required:
                - phone_number
          description: Consumer-stated PII fields for the user. Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              description: >-
                Given name(s) / first name of the individual being enrolled. Can be provided via the
                token payload (bound at /v3/token) instead of the request body.
              example: John
            last_name:
              type: string
              minLength: 1
              description: >-
                Last name / surname of the individual being enrolled. Can be provided via the token
                payload (bound at /v3/token) instead of the request body.
              example: Doe
            email:
              type: string
              format: email
              nullable: true
              description: >-
                Email address of the individual being enrolled. At least one of email or
                phone_number is required. Can be provided via the token payload (bound at /v3/token)
                instead of the request body.
              example: john@example.com
            phone_number:
              type: string
              pattern: ^\+[1-9]\d{6,14}$
              nullable: true
              description: >-
                Phone number in E.164 format (must start with +). At least one of email or
                phone_number is required.
              example: '+2348012345678'
        allow_new_enroll:
          type: boolean
          default: false
          description: >-
            If true, allows re-enrollment for a user who is already enrolled. The existing
            enrollment will be replaced with the new selfie. If false (default), enrollment fails if
            the user is already enrolled.
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted. Must
            be on the partner's allowed callback domains list. Can be provided via the token payload
            (bound at /v3/token) instead of the request body.
          example: https://example.com/callback
        sandbox_result:
          type: number
          description: >-
            Force a specific result code in sandbox/test environments. Only effective when the
            partner account is in sandbox mode.
          example: 840
        partner_params:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata for partner reference.
          example:
            order_id: ORD-12345
        metadata:
          type: array
          description: Additional metadata entries (e.g., SDK telemetry, device info).
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
    BiometricKycRequest:
      type: object
      required:
        - selfie_image
        - liveness_images
        - consent
        - country
        - id_type
        - id_number
        - user_details
      properties:
        selfie_image:
          type: string
          format: binary
          description: >-
            JPEG selfie image used for biometric verification. Must be a clear, well-lit,
            front-facing photo.
        liveness_images:
          type: array
          minItems: 6
          maxItems: 8
          items:
            type: string
            format: binary
          description: >-
            Array of JPEG liveness sequence images captured during the liveness check. These images
            are used for passive and active liveness verification.
        consent:
          $ref: '#/components/schemas/Consent'
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: >-
            ISO 3166-1 alpha-2 country code (uppercase). Can be provided via the token payload
            (bound at /v3/token) instead of the request body.
          example: NG
        id_type:
          type: string
          description: >-
            ID document type (e.g., NIN, BVN, DRIVERS_LICENSE). Can be provided via the token
            payload (bound at /v3/token) instead of the request body.
          example: NIN
        id_number:
          type: string
          description: >-
            ID document number. Must match the regex format for the country/id_type. Can be provided
            via the token payload (bound at /v3/token) instead of the request body.
          example: '12345678901'
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required:
                - email
            - required:
                - phone_number
          description: Consumer-stated PII fields for the user. Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              description: >-
                Given name(s) / first name of the individual. Can be provided via the token payload
                (bound at /v3/token) instead of the request body.
              example: John
            last_name:
              type: string
              minLength: 1
              description: >-
                Last name / surname of the individual. Can be provided via the token payload (bound
                at /v3/token) instead of the request body.
              example: Doe
            email:
              type: string
              format: email
              nullable: true
              description: >-
                Email address of the individual. At least one of email or phone_number is required.
                Can be provided via the token payload (bound at /v3/token) instead of the request
                body.
              example: john@example.com
            phone_number:
              type: string
              pattern: ^\+[1-9]\d{6,14}$
              nullable: true
              description: >-
                Phone number in E.164 format (must start with +). At least one of email or
                phone_number is required.
              example: '+2348012345678'
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted. Must
            be on the partner's allowed callback domains list. Can be provided via the token payload
            (bound at /v3/token) instead of the request body.
          example: https://example.com/callback
        sandbox_result:
          type: number
          description: >-
            Force a specific result code in sandbox/test environments. Only effective when the
            partner account is in sandbox mode.
          example: 1220
        partner_params:
          type: object
