        id_type:
          type: string
          description: >-
            ID document type (e.g., DRIVERS_LICENSE, NATIONAL_ID). Optional for standard Document
            Verification — the document type is auto-classified if not provided. Can be provided via
            the token payload (bound at /v3/token) instead of the request body.
