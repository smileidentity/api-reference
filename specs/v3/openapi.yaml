                    antifraud: null
                    device_signals: null
                block_match_found:
                  summary: 1030/1023 — potential match(es) identified
                  value:
                    status: block
                    message: 'Screening completed: potential matches identified.'
                    reason: aml_match_found
                    created_at: '2026-07-20T12:00:00.000Z'
                    completed_at: '2026-07-20T12:00:01.000Z'
