  /v3/aml/sync:
    post:
      operationId: submitOneTimeAmlSync
      tags:
        - One-Time AML
      security:
        - SmileIDToken: []
      summary: Submit One-Time AML screening and receive the result inline
      description: >-
        Synchronous counterpart to `POST /v3/aml`. Runs the same One-Time AML screening (job type
        15) and returns the terminal result in the response body instead of delivering it to a
        callback URL, so a verification can be completed in a single request without hosting a
        public webhook endpoint.

        The request body and every entry validation are identical to the async endpoint, with one
        exception: `callback_url` is optional here. If you do supply one it is stored so `POST
        /v3/replay/{job_id}` can use it later, but no webhook is ever sent — the result is in this
        response.

        The 200 body is exactly the payload the async callback would have delivered, so a partner
        can move between the two endpoints without changing how they parse a result.

        The response carries `Response-Signature` and `Response-Timestamp`, computed the same way as
        on our webhooks, so existing signature verification applies unchanged.

        Screening is performed inline against the provider, so this endpoint is slower than the
        async one and is bounded by a request deadline. If the provider does not answer within it,
        the response is a 408 and no charge is made.

        Every response returned after the job is created carries a `SmileID-Job-ID` header, and a
        completed screening can always be read back from `GET /v3/status/{jobId}` — so if you have a
        job id, read it rather than resubmitting. If you do not (a network failure, or the gateway
        timing the request out on its own), resubmit with the same `SmileID-Idempotency-Key`: the
        retry resolves to the same job and returns the original result instead of running a second,
        separately billed screening.
      parameters:
        - name: SmileID-Source-SDK
          in: header
          required: false
          description: Source SDK identifier.
          schema:
            type: string
            example: android
        - name: SmileID-Source-SDK-Version
          in: header
          required: false
          description: Source SDK version.
          schema:
            type: string
            example: 10.4.2
        - name: SmileID-Timestamp
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: >-
            ISO 8601 timestamp used as the salt when computing SmileID-Request-Signature. Required
            when your Smile ID account is configured to use SDK/partner secret HMAC authentication.
          schema:
            type: string
            format: date-time
            example: '2026-03-10T12:00:00.000Z'
        - name: SmileID-Request-Signature
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: >-
            HMAC signature of the raw HTTP request body, computed with your SDK/partner secret and
            the value of SmileID-Timestamp as salt. Required when your Smile ID account is
            configured to use SDK/partner secret HMAC authentication.
          schema:
            type: string
            example: 4f2d9c6b8a7e3f1c0d5e4b3a2c1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2
        - name: User-ID
          in: header
          required: false
          description: >-
            Partner-provided user identifier. Must agree with body `user_id` and any token-bound
            user id — disagreement is a 403. If omitted everywhere, a TypeID is generated
            automatically.
          schema:
            type: string
        - name: SmileID-Idempotency-Key
          in: header
          required: false
          description: >-
            Opaque key, 16 to 128 characters of `A-Z a-z 0-9 - _`, that makes a submission safe to
            repeat. The job id is derived from it, so a request carrying a key you have already used
            resolves to that same job: it returns the original result and screens — and bills —
            nothing a second time. Send one whenever you might retry, since a retry without a key
            starts a new, separately billed screening.
          schema:
            type: string
            example: kuda-onboarding-8f14e45fceea167a
      requestBody:
        required: true
        description: >-
          Identical to `POST /v3/aml`, except that `callback_url` is optional because no callback is
          sent. Sent as multipart/form-data. Scalar fields (full_name, birth_year, strict_match,
          search_existing_user, user_id, source_sdk, source_sdk_version) are plain form fields.
          Non-scalar fields must be sent as JSON-encoded strings in their form part: the array
          fields countries and aliases (e.g. countries='["NG","KE"]') and the object fields consent,
          user_details, metadata, and partner_params. Multipart has no native array encoding, so a
          bare or repeated countries field is rejected — it must be a JSON array string.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OneTimeAmlRequest'
      responses:
        '200':
          description: >-
            Screening completed. The body is the terminal result — the same payload the async
            callback would have delivered.
          headers:
            Response-Signature:
              description: >-
                Signature over Response-Timestamp and your partner id, keyed with your API key.
                Identical in construction to the signature we send on webhooks, so existing
                verification code applies unchanged.
              schema:
                type: string
                example: Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZmdoaWo=
            Response-Timestamp:
              description: ISO 8601 timestamp the signature was computed over.
              schema:
                type: string
                format: date-time
                example: '2026-07-20T12:00:01.000Z'
            SmileID-Job-ID:
              description: The Smile job id for this screening.
              schema:
                type: string
                example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
            User-ID:
              description: The partner-scoped user id for this screening.
              schema:
                type: string
                example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeAmlCallback'
              examples:
                clear:
                  summary: 1031 — no matches found
                  value:
                    status: clear
                    message: 'Screening completed: no matches found.'
                    reason: null
                    created_at: '2026-07-20T12:00:00.000Z'
                    completed_at: '2026-07-20T12:00:01.000Z'
