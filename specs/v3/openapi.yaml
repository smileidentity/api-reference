        '400':
          description: Bad Request — validation error in request body or headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingCountries:
                  summary: Missing or invalid countries
                  value:
                    status: Bad Request
                    message: Required field 'countries' is missing or invalid.
                missingFullName:
                  summary: Missing or invalid full_name
                  value:
                    status: Bad Request
                    message: Required field 'full_name' is missing or invalid.
        '401':
          description: Unauthorized — invalid or missing authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unauthorized
                message: Invalid authentication credentials.
        '402':
          description: Payment Required — insufficient wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Payment Required
                message: You are out of credits. Add funds to your wallet to run more verifications.
        '403':
          description: >-
            Forbidden — product not enabled, IP not allowlisted, production access not granted, or a
            user id conflict between body, header, and token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                productNotEnabled:
                  summary: One-Time AML not enabled for this partner
                  value:
                    status: Forbidden
                    message: This feature requires you to activate ID Validation for your Smile ID account.
                ipNotAllowed:
                  summary: Caller IP not on the partner allowlist
                  value:
                    status: Forbidden
                    message: You are not authorized to do that.
        '404':
          description: >-
            Not Found — `search_existing_user` was true but no usable prior record exists for this
            user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                noEnrollee:
                  summary: No enrolled user for this partner
                  value:
                    status: Not Found
                    message: No enrolled user found for this partner.
                noUsablePriorRecord:
                  summary: No usable prior KYC record
                  value:
                    status: Not Found
                    message: No prior KYC record with a usable name and country was found for this user.
        '408':
          description: >-
            Request Timeout — the screening provider did not answer within the request deadline, so
            no result was produced and nothing is billed. The job exists and is terminal in `error`,
            so `GET /v3/status/{jobId}` will only ever return that error: resubmit rather than poll.
            Send `SmileID-Idempotency-Key` to make the resubmission safe to repeat.
          headers:
            SmileID-Job-ID:
              description: The Smile job id to poll for this screening.
              schema:
                type: string
                example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Request Timeout
                message: >-
                  The screening provider did not respond in time. The job is still recorded —
                  retrieve its result from /v3/status/{job_id}.
        '413':
          description: Content Too Large — the request payload exceeds the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Content Too Large
                message: Request payload is too large.
        '415':
          description: Unsupported Media Type — request must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unsupported Media Type
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
        '429':
          description: Too Many Requests — rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Too Many Requests
                message: Rate limit exceeded. Please try again later.
        '500':
          description: >-
            Internal Server Error. A screening that could not be completed for an internal reason is
            reported here rather than as a 200 carrying `status: error`. As with a 408, the job
            exists and its outcome can be read from `GET /v3/status/{jobId}`.
          headers:
            SmileID-Job-ID:
              description: >-
                The Smile job id to poll for this screening. Present when the failure happened after
                the job was created.
              schema:
                type: string
                example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Internal Server Error
                message: An unexpected error occurred. Please try again or contact support.
  /v3/replay/{job_id}:
    post:
      operationId: replayCallback
      tags:
        - Callback Replay
      security:
        - SmileIDToken: []
      summary: Replay a callback for a completed verification
      description: >-
        Looks up a previously completed verification by its TypeID, resolves the callback URL, and
        re-sends the callback. The verification must have reached a terminal state (clear, block,
        attention, or error) before its callback can be replayed.

        An optional `callback_url` in the request body overrides the stored URL, subject to the
        partner's callback domain allowlist.
      parameters:
        - name: job_id
          in: path
          required: true
          description: TypeID format verification identifier with 'job_' prefix.
          schema:
            type: string
            pattern: ^job_[0-9a-z]{26}$
            example: job_01h2xcejqtf2nbrexx3vqjhp41
      requestBody:
        required: false
        description: >-
          Optional body to override the callback URL. If omitted, the stored callback URL (from the
          original verification or partner default) is used.

          Send the body as `multipart/form-data`. Any other content type is rejected with 415.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReplayCallbackRequest'
            example:
              callback_url: https://partner.example.com/webhook
      responses:
        '202':
          description: Callback replay accepted and queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayCallbackResponse'
              example:
                status: accepted
                job_id: job_01h2xcejqtf2nbrexx3vqjhp41
                user_id: test-user
                message: Callback replay queued successfully.
        '400':
          description: >-
            Bad Request — invalid job_id format, unrecognised product, or no valid callback URL
            available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                invalidJobId:
                  summary: Invalid TypeID format
                  value:
                    status: Bad Request
                    message: '"job_id" must be a valid TypeID with prefix ''job_'''
                noCallbackUrl:
                  summary: No callback URL resolvable
                  value:
                    status: Bad Request
                    message: No valid callback URL available
                unknownProduct:
                  summary: Product cannot be inferred
                  value:
                    status: Bad Request
                    message: Unable to determine product for this job
        '401':
          description: Unauthorized — invalid or missing authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unauthorized
                message: Invalid authentication credentials.
        '403':
          description: >-
            Forbidden — IP not in allowlist, callback URL not in allowed domains, or security checks
            failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Forbidden
                message: You are not authorized to do that.
        '404':
          description: >-
            Not Found — verification does not exist, does not belong to this partner, or has no
            reference entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                jobNotFound:
                  summary: Verification not found or belongs to another partner
                  value:
                    status: Not Found
                    message: Job not found
                referenceNotFound:
                  summary: Reference entry missing for the verification
                  value:
                    status: Not Found
                    message: Reference not found for this job
        '409':
          description: >-
            Conflict — verification has not yet reached a terminal state. Wait for processing to
            complete before replaying the callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Conflict
                message: Job is still processing. Callbacks can only be replayed for completed jobs.
        '415':
          description: >-
            Unsupported Media Type — a body was sent with a `Content-Type` other than
            `multipart/form-data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unsupported Media Type
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Internal Server Error
                message: An unexpected error occurred. Please try again or contact support.
  /v3/users/{user_id}/report_fraud:
    post:
      operationId: reportUserFraud
      tags:
        - Users
      summary: Flag or clear fraud status for a user
      description: |
        Records a fraud report (or fraud-clearance) for a previously enrolled
        user.

        Use `is_fraud: true` to flag a user as fraudulent, or `is_fraud: false`
        to clear a previous flag. Flagging propagates the user's face, device,
        and biometric clusters to the relevant block lists so that subsequent
        verifications matching them are rejected. Clearing the flag reverses
        these effects.

        The response is `202 Accepted` once the request has been validated
        and handled.
      security:
        - SmileIDToken: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: |
            The partner-scoped user identifier of the enrolled user being
            reported. This is the `user_id` value originally provided during
            enrollment.
          schema:
            type: string
          example: user-123
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportUserFraudRequest'
            examples:
              flagFirstParty:
                summary: Flag a user (reason only)
                value:
                  is_fraud: true
                  reason: FIRST_PARTY_FRAUD
                  reported_by: risk@partner.example
              flagWithNotes:
                summary: Flag a user with optional notes
                value:
                  is_fraud: true
                  reason: ACCOUNT_TAKEOVER
                  notes: Confirmed via partner internal review
                  reported_by: risk@partner.example
              flagOther:
                summary: Flag a user with reason=OTHER (notes required)
                value:
                  is_fraud: true
                  reason: OTHER
                  notes: Bespoke fraud pattern observed by internal review
                  reported_by: risk@partner.example
              clearFlag:
                summary: Clear a previous fraud flag (notes required)
                value:
                  is_fraud: false
                  notes: Cleared by appeals review
                  reported_by: risk@partner.example
      responses:
        '202':
          description: Fraud report accepted and queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportUserFraudAcceptedResponse'
              example:
                status: accepted
                message: Fraud report accepted
                user_id: user-123
        '400':
          description: |
            Validation error. Possible causes:
            - `user_id` path parameter is missing.
            - `is_fraud` is missing or not a boolean.
            - `reason` is missing when `is_fraud` is `true`, or is not one of
              the allowed values.
            - `notes` is missing when `is_fraud` is `false` or `reason` is
              `OTHER`.
            - `notes` exceeds 500 characters.
            - `reported_by` is missing or is not a valid email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingReason:
                  summary: Missing reason when flagging
                  value:
                    message: Required field 'reason' is missing or invalid.
                    status: Bad Request
                invalidReason:
                  summary: Unrecognised reason value
                  value:
                    message: >-
                      Field 'reason' must be one of: FIRST_PARTY_FRAUD, SECOND_PARTY_FRAUD,
                      THIRD_PARTY_FRAUD, SYNTHETIC_IDENTITY, ACCOUNT_TAKEOVER, DOCUMENT_FORGERY,
                      IDENTITY_FARMING, MULE_ACCOUNT, OTHER.
                    status: Bad Request
                missingNotesOnUnblock:
                  summary: Missing notes when clearing
                  value:
                    message: Required field 'notes' is missing or invalid when is_fraud is false.
                    status: Bad Request
                missingNotesOnOther:
                  summary: Missing notes when reason=OTHER
                  value:
                    message: Required field 'notes' is missing or invalid when reason is 'OTHER'.
                    status: Bad Request
                notesTooLong:
                  summary: Notes exceed maximum length
                  value:
                    message: Field 'notes' must be at most 500 characters.
                    status: Bad Request
                invalidEmail:
                  summary: Invalid reporter email
                  value:
                    message: Field 'reported_by' must be a valid email address.
                    status: Bad Request
        '401':
          description: Authentication failed (invalid or missing token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Invalid token
                status: Unauthorized
        '403':
          description: |
            Access denied. Possible causes:
            - IP address is on the blocklist.
            - IP not in partner's allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: You are not authorized to do that.
                status: Forbidden
        '404':
          description: No enrollee found for the given `user_id` and partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: User not found
                status: Not Found
        '415':
          description: |
            Wrong or missing `Content-Type` header. The request body must be
            sent as `multipart/form-data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
                status: Unsupported Media Type
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                message: System Error
                status: Internal Server Error
  /v3/services/bank_codes:
    get:
      operationId: getBankCodes
      tags:
        - Services
      summary: List bank codes
      description: |
        Returns a list of bank codes supported for bank-account-based identity
        verification. Optionally filtered by country.
      security: []
      parameters:
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: Successful response containing bank codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCodesResponse'
              example:
                bank_codes:
                  - code: '044'
                    country: NG
                    name: Access Bank
                  - code: '023'
                    country: NG
                    name: Citibank
        '403':
          description: Request blocked (IP blocked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
              example:
                error: You are not authorized to do that.
                code: '2413'
  /v3/services/supported_id_types:
    get:
      operationId: getSupportedIdTypes
      tags:
        - Services
      summary: List supported KYC ID types
      description: |
        Returns a list of all KYC ID types supported for identity verification,
        including their validation regex, required fields, and optional bank code.
        Optionally filtered by country.
      security: []
      parameters:
