      properties:
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: >-
            Override callback URL. Must be on the partner's callback domain allowlist. If omitted,
            the stored callback URL is used. Can also be provided via the token payload (see
            /v3/token).
          example: https://partner.example.com/webhook
    ReplayCallbackResponse:
      type: object
      required:
        - status
        - job_id
        - user_id
        - message
      properties:
        status:
          type: string
          description: Always 'accepted' for successful replay requests.
          enum:
            - accepted
          example: accepted
        job_id:
          type: string
          description: TypeID format verification identifier.
          example: job_01h2xcejqtf2nbrexx3vqjhp41
        user_id:
          type: string
          description: User ID associated with the verification (from partner_params).
          example: test-user
        message:
          type: string
          description: Human-readable confirmation message.
          example: Callback replay queued successfully.
    ReportUserFraudRequest:
      type: object
      required:
        - is_fraud
        - reported_by
      properties:
        is_fraud:
          type: boolean
          description: |
            `true` to flag the user as fraudulent, `false` to clear a previous
            fraud flag.
          example: true
        reason:
          type: string
          description: |
            Reason for the fraud report. **Required when `is_fraud` is `true`**;
            ignored when `is_fraud` is `false`. If `OTHER` is selected, `notes`
            becomes required.
          enum:
            - FIRST_PARTY_FRAUD
            - SECOND_PARTY_FRAUD
            - THIRD_PARTY_FRAUD
            - SYNTHETIC_IDENTITY
            - ACCOUNT_TAKEOVER
            - DOCUMENT_FORGERY
            - IDENTITY_FARMING
            - MULE_ACCOUNT
            - OTHER
          example: FIRST_PARTY_FRAUD
        notes:
          type: string
          maxLength: 500
          description: |
            Free-form notes describing the fraud report. **Required when**
            either `is_fraud` is `false` or `reason` is `OTHER`. Optional in
            all other cases. Capped at 500 characters.
          example: Account takeover confirmed via partner internal review.
        reported_by:
          type: string
          format: email
          description: Email address of the person submitting the report.
          example: risk@partner.example
      additionalProperties: true
    ReportUserFraudAcceptedResponse:
      type: object
      required:
        - status
        - user_id
      properties:
        status:
          type: string
          enum:
            - accepted
          description: Always `accepted` when the request was queued for processing.
          example: accepted
        message:
          type: string
          description: Human-readable result message.
          example: Fraud report accepted
        user_id:
          type: string
          description: The `user_id` that was reported.
          example: user-123
