          pattern: ^https://
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted. Must
            be on the partner's allowed callback domains list. Can be provided via the token payload
            (bound at /v3/token) instead of the request body.
          example: https://example.com/callback
        bank_code:
          type: string
          description: Bank code (required for certain ID types like BANK_ACCOUNT).
          example: '044'
        operator:
          type: string
          description: Telecom operator (required for certain ID types).
        partner_params:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata for partner reference.
          example:
            order_id: ORD-12345
        metadata:
          type: array
          description: Additional metadata entries.
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
    OneTimeAmlRequest:
      type: object
      required:
        - countries
        - full_name
        - consent
        - user_details
      properties:
        user_id:
          type: string
          minLength: 1
          nullable: true
          description: >-
            Partner-provided user identifier. Optional in general; required when
            `search_existing_user` is `true`. Reconciled with the `User-ID` header and any
            token-bound user id after authentication — disagreement is a 403. Generated
            automatically as a TypeID when omitted everywhere.
          example: user-1234
        countries:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 2
          description: >-
            ISO 3166-1 alpha-2 country codes (uppercase) to screen against. Remains authoritative
            for the screening even when `search_existing_user` is `true`. Sent as a JSON-encoded
            array string in the multipart part (e.g. `["NG","KE"]`).
          example:
            - NG
            - KE
        full_name:
          type: string
          minLength: 1
          description: >-
            Full name to screen. Remains authoritative for the screening — never replaced or
            compared with prior enrollee information, even when `search_existing_user` is `true`.
          example: John Doe
        birth_year:
          type: string
          pattern: ^\d{4}$
          nullable: true
          description: >-
            Optional four-digit birth year, minimum 1000 and maximum the current UTC year. A bare
            integer is also accepted. Full dates, decimals, non-four-digit values, and future years
            are rejected.
          example: '1990'
        strict_match:
          type: boolean
          default: true
          description: >-
            Optional. When `true` (default), uses the stricter match filter set; when `false`, uses
            a looser filter set. Accepts standard multipart boolean string representations
            (`"true"`/`"false"`). Always echoed back on the callback.
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 256
          description: >-
            Optional list of alternate names to screen, at most 20 entries, each at most 256
            characters. Sent as a JSON-encoded array string in the multipart part (e.g. `["Johnny
            Doe"]`).
          example:
            - Johnny Doe
        search_existing_user:
          type: boolean
          default: false
          description: >-
            Optional. A gate, not a data source: when `true`, requires the resolved `user_id` to
            belong to a partner-scoped, non-deleted enrollee with at least one non-expired prior KYC
            record carrying a usable name and country. It never overwrites `full_name`, `countries`,
            or `birth_year` — those stay authoritative. Accepts standard multipart boolean string
            representations.
        consent:
          $ref: '#/components/schemas/Consent'
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required:
                - email
            - required:
                - phone_number
          description: >-
            Consumer-stated PII fields for the screened user. Either email or phone_number must be
            provided.
          properties:
            given_names:
              type: string
              minLength: 1
              description: Given names of the individual.
              example: John
            last_name:
              type: string
              minLength: 1
              description: Last name / surname of the individual.
              example: Doe
            email:
              type: string
              format: email
              nullable: true
              description: Email address. At least one of email or phone_number is required.
              example: john@example.com
            phone_number:
              type: string
              pattern: ^\+[1-9]\d{6,14}$
              nullable: true
              description: >-
                Phone number in E.164 format (must start with +). At least one of email or
                phone_number is required.
              example: '+2348012345678'
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted. Must
            be on the partner's allowed callback domains list.
          example: https://example.com/callback
        partner_params:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata for partner reference.
          example:
            order_id: ORD-12345
        metadata:
          type: array
          description: Additional metadata entries.
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
        source_sdk:
          type: string
          description: Source SDK identifier. Can also be provided via the `SmileID-Source-SDK` header.
          example: android
        source_sdk_version:
          type: string
          description: Source SDK version. Can also be provided via the `SmileID-Source-SDK-Version` header.
          example: 10.4.2
    OneTimeAmlAcceptedResponse:
      type: object
      required:
        - status
        - message
        - job_id
        - user_id
      properties:
        status:
          type: string
          enum:
            - accepted
          description: Acceptance status for the queued screening request.
        message:
          type: string
          enum:
            - Job submitted successfully
          description: Human-readable acceptance message.
        job_id:
          type: string
          description: TypeID format verification identifier for tracking.
          example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
        user_id:
          type: string
          description: TypeID format user identifier, or the reconciled partner-provided user identifier.
          example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
    AmlPersonMatch:
      type: object
      description: >-
        A single sanctions/PEP/adverse-media hit. Public snake_case fields only — internal provider
        references (e.g. sigma_ref) are always stripped before the callback is sent.
      additionalProperties: true
      properties:
        name:
          type: string
        addresses:
          type: array
          items:
            type: object
            additionalProperties: true
        news_summary:
          description: >-
            Per-category summary of the person's news-media exposure. The raw article list the
            provider returns under `adverse_media` is never included in the callback; a screening
            whose only hits are news media resolves to `attention` / `news_media_match`.
          type: array
          items:
            type: object
            properties:
              news_category:
                type: string
              news_category_label:
                type: string
              number_of_articles:
                type: integer
        aliases:
          type: array
          items:
            type: object
            additionalProperties: true
        associations:
          type: array
          items:
            type: object
            additionalProperties: true
        dates_of_birth:
          type: array
          items:
            type: object
            additionalProperties: true
        enforcement_actions:
          type: array
          items:
            type: object
            additionalProperties: true
        nationalities:
          type: array
          items:
            type: object
            additionalProperties: true
        sanctions:
          type: array
          items:
            type: object
            additionalProperties: true
        pep:
          type: object
          properties:
            pep_level:
              type: integer
              nullable: true
            political_positions:
              type: array
              items:
                type: string
            sources:
              type: array
              items:
                type: object
                additionalProperties: true
    OneTimeAmlCallback:
      type: object
      required:
        - status
        - message
        - reason
        - created_at
        - product
        - partner_params
        - kyc_receipt
        - strict_match
        - no_of_persons_found
        - people
        - user_provided_info
        - consent
        - antifraud
        - device_signals
      properties:
        status:
          type: string
          enum:
            - clear
            - block
            - attention
            - error
          description: Terminal outcome of the screening.
        message:
          type: string
          description: Canonical human-readable outcome message.
          example: 'Screening completed: no matches found.'
        reason:
          type: string
          nullable: true
          description: Canonical machine-readable reason. `null` for a clear outcome.
          enum:
            - null
            - aml_match_found
            - news_media_match
            - service_unavailable
            - high_risk
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp the screening job started processing.
        completed_at:
          type: string
          format: date-time
          description: >-
            ISO 8601 timestamp the terminal outcome was reached. Omitted only if the terminal state
            could not be read.
        product:
          type: string
          enum:
            - one_time_aml
        partner_params:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: >-
            Partner-supplied key-value metadata, with internal transport keys (`_sandbox_v3`,
            `job_id`, `job_type`, `user_id`) stripped. `null` when empty.
        kyc_receipt:
          type: string
          nullable: true
          description: >-
            Signed receipt URL. `null` on submission; populated for `clear`, `block`, and
            `attention` outcomes. Remains `null` for `error`.
        strict_match:
          type: boolean
          description: The resolved `strict_match` value used for the screening.
        no_of_persons_found:
          type: integer
          description: Count of sanctions/PEP/adverse-media matches found.
        people:
          type: array
          items:
            $ref: '#/components/schemas/AmlPersonMatch'
        user_provided_info:
          type: object
          required:
            - given_names
            - last_name
            - email
            - phone_number
          properties:
            given_names:
              type: string
              nullable: true
            last_name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            phone_number:
              type: string
              nullable: true
        consent:
          type: object
          additionalProperties: true
          description: ISO 27560 consent record for the granted consent.
        antifraud:
          type: object
          nullable: true
          additionalProperties: true
          description: Antifraud risk assessment. `null` when no scored fraud result exists for the job.
        device_signals:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Device/network signals captured at submission time. Always `null` for an `error`
            outcome, and best-effort `null` when no metadata was captured.
    ReplayCallbackRequest:
      type: object
      properties:
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: >-
            Override callback URL. Must be on the partner's callback domain allowlist. If omitted,
            the stored callback URL is used. Can also be provided via the token payload (see
            /v3/token).
          example: https://partner.example.com/webhook
    ReplayCallbackResponse:
      type: object
      required:
        - status
        - job_id
        - user_id
        - message
      properties:
        status:
          type: string
          description: Always 'accepted' for successful replay requests.
          enum:
            - accepted
          example: accepted
        job_id:
          type: string
          description: TypeID format verification identifier.
          example: job_01h2xcejqtf2nbrexx3vqjhp41
        user_id:
          type: string
          description: User ID associated with the verification (from partner_params).
          example: test-user
        message:
          type: string
          description: Human-readable confirmation message.
          example: Callback replay queued successfully.
    ReportUserFraudRequest:
      type: object
      required:
        - is_fraud
        - reported_by
      properties:
        is_fraud:
          type: boolean
          description: |
            `true` to flag the user as fraudulent, `false` to clear a previous
            fraud flag.
          example: true
        reason:
          type: string
          description: |
            Reason for the fraud report. **Required when `is_fraud` is `true`**;
            ignored when `is_fraud` is `false`. If `OTHER` is selected, `notes`
            becomes required.
          enum:
            - FIRST_PARTY_FRAUD
            - SECOND_PARTY_FRAUD
            - THIRD_PARTY_FRAUD
            - SYNTHETIC_IDENTITY
            - ACCOUNT_TAKEOVER
            - DOCUMENT_FORGERY
            - IDENTITY_FARMING
            - MULE_ACCOUNT
            - OTHER
          example: FIRST_PARTY_FRAUD
        notes:
          type: string
          maxLength: 500
          description: |
            Free-form notes describing the fraud report. **Required when**
            either `is_fraud` is `false` or `reason` is `OTHER`. Optional in
            all other cases. Capped at 500 characters.
          example: Account takeover confirmed via partner internal review.
        reported_by:
          type: string
          format: email
          description: Email address of the person submitting the report.
          example: risk@partner.example
      additionalProperties: true
    ReportUserFraudAcceptedResponse:
      type: object
      required:
        - status
        - user_id
      properties:
        status:
          type: string
          enum:
            - accepted
          description: Always `accepted` when the request was queued for processing.
          example: accepted
        message:
          type: string
          description: Human-readable result message.
          example: Fraud report accepted
        user_id:
          type: string
          description: The `user_id` that was reported.
          example: user-123
    BankCode:
      type: object
      required:
        - code
        - country
        - name
      properties:
        code:
          type: string
          description: Numeric bank code assigned by the country's central bank.
          example: '044'
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        name:
          type: string
          description: Human-readable bank name.
          example: Access Bank
    BankCodesResponse:
      type: object
      properties:
        bank_codes:
          type: array
          items:
            $ref: '#/components/schemas/BankCode'
    SupportedIdType:
      type: object
      required:
        - country
        - type
        - label
        - regex
      properties:
        bank_code:
          type: string
          description: |
            Bank code required for this ID type. Only present for ID types that are
            bank-specific (e.g. `BANK_ACCOUNT`).
          example: '044'
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        label:
          type: string
          description: Human-readable label for the ID type.
          example: Bank Verification Number
        regex:
          type: string
          description: |
            Regular expression pattern (without delimiters) that the ID number must
            match for this ID type.
          example: ^\d{11}$
        required_fields:
          type: array
          items:
            type: string
          description: |
            List of field names that must be provided when submitting a verification
            request for this ID type (e.g. `first_name`, `last_name`, `dob`).
          example:
            - first_name
            - last_name
            - dob
        type:
          type: string
          description: Machine-readable ID type code.
          example: BVN
    SupportedIdTypesResponse:
      type: object
      properties:
        id_types:
          type: array
          items:
            $ref: '#/components/schemas/SupportedIdType'
    Country:
      type: object
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        name:
          type: string
          description: Country name.
          example: Nigeria
        continent:
          type: string
          description: Continent name.
          example: AFRICA
    IDType:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable ID type code.
          example: DRIVERS_LICENSE
        name:
          type: string
          description: Human-readable name of the ID type.
          example: Driver's License
        example:
          type: array
          items:
            type: string
          description: Example ID numbers or usage hints.
        has_back:
          type: boolean
          description: Whether this document type has a back side that should be captured.
          example: true
    SupportedDocument:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/Country'
        id_types:
          type: array
          items:
            $ref: '#/components/schemas/IDType'
    SupportedDocumentsResponse:
      type: object
      required:
        - valid_documents
      properties:
        valid_documents:
          type: array
          items:
            $ref: '#/components/schemas/SupportedDocument'
    IdStatusResponse:
      type: object
      required:
        - last_checked
        - last_check_status
        - last_hour_success_rate
        - last_known_status
        - last_check_success_rate
      properties:
        last_checked:
          type: string
          format: date-time
          description: Timestamp of the most recent uptime check.
          example: '2026-04-14T12:30:00.000Z'
        last_check_status:
          type: string
          enum:
            - success
            - failure
          description: Whether the most recent check succeeded or failed.
          example: success
        last_hour_success_rate:
          type: string
          description: Aggregate success rate over the last hour as a percentage.
          example: 95%
        last_known_status:
          type: string
          description: The raw status string from the most recent check (e.g. "online", "offline").
          example: online
        last_check_success_rate:
          type: string
          description: Success rate of the most recent individual check as a percentage.
          example: 90%
    ServiceErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Smile Identity error code.
    IdStatusErrorResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Human-readable error message.
        status:
          type: string
          description: HTTP status text (e.g. "Bad Request", "Unauthorized").
    SmartSelfieCompareRequest:
      type: object
      required:
        - selfie_image
        - comparison_image
        - comparison_image_type
        - consent
        - user_details
      properties:
        selfie_image:
          type: string
          format: binary
          description: JPEG selfie image.
        comparison_image:
          type: string
          format: binary
          description: JPEG comparison image (ID card photo, ID photo, or portrait).
        comparison_image_type:
          type: string
          enum:
            - DOCUMENT
            - ID_PHOTO
            - PORTRAIT
          description: Type of comparison image being submitted.
        consent:
          $ref: '#/components/schemas/Consent'
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required:
                - email
            - required:
                - phone_number
          description: Consumer-stated PII fields for the user. Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              example: Alice
            last_name:
              type: string
              minLength: 1
              example: Johnson
            email:
              type: string
              format: email
              nullable: true
              description: At least one of email or phone_number is required.
              example: alice@example.com
            phone_number:
              type: string
              pattern: ^\+[1-9]\d{6,14}$
              nullable: true
              description: Phone number in E.164 format. At least one of email or phone_number is required.
              example: '+2348012345678'
        liveness_images:
          type: array
          minItems: 6
          maxItems: 8
          items:
            type: string
            format: binary
          description: Optional array of JPEG liveness images. If omitted, active liveness check is skipped.
        allow_new_enroll:
          type: boolean
          default: false
          description: If true, allows re-enrollment for a user who is already enrolled.
        user_id:
          type: string
          description: Optional user identifier. If provided and the job passes, the user will be enrolled.
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          description: URL to receive the async result callback.
          example: https://example.com/callback
        sandbox_result:
          type: number
          description: Force a specific result code in sandbox mode.
        partner_params:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
    JobStatusResponse:
      type: object
      required:
        - status
        - job_id
        - user_id
        - message
        - created_at
      properties:
        status:
          type: string
          description: >-
            Verification status. Terminal states (clear, block, attention, error) are returned with
            HTTP 200; processing is returned with HTTP 202; not_found is returned with HTTP 404.
          enum:
            - clear
            - block
            - attention
            - error
            - processing
            - not_found
          example: clear
        job_id:
          type: string
          description: TypeID format verification identifier.
          example: job_01h2xcejqtf2nbrexx3vqjhp41
        user_id:
          type: string
          description: User ID associated with the verification.
          example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
        message:
          type: string
          description: Human-readable status message.
          example: Job completed
        created_at:
          type: string
          format: date-time
          description: Timestamp the status response was generated (ISO 8601).
          example: '2026-07-07T12:34:56.000Z'
  securitySchemes:
    SmileIDToken:
      type: apiKey
      in: header
      name: SmileID-Token
      description: JWT token obtained from `POST /v3/token`.
      x-gitbook-token-placeholder: YOUR_GENERATED_TOKEN
