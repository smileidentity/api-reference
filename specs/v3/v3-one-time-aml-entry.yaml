  /v3/aml/sync:
    post:
      operationId: submitOneTimeAmlSync
      tags:
        - One-Time AML
      security:
        - SmileIDToken: []
      summary: Submit One-Time AML screening and receive the result inline
      description: >-
        Synchronous counterpart to `POST /v3/aml`. Runs the same One-Time AML
        screening (job type 15) and returns the terminal result in the response
        body instead of delivering it to a callback URL, so a verification can
        be completed in a single request without hosting a public webhook
        endpoint.

        The request body and every entry validation are identical to the async
        endpoint, with one exception: `callback_url` is optional here. If you do
        supply one it is stored so `POST /v3/replay/{job_id}` can use it later,
        but no webhook is ever sent — the result is in this response.

        The 200 body is exactly the payload the async callback would have
        delivered, so a partner can move between the two endpoints without
        changing how they parse a result.

        The response carries `Response-Signature` and `Response-Timestamp`,
        computed the same way as on our webhooks, so existing signature
        verification applies unchanged.

        Screening is performed inline against the provider, so this endpoint is
        slower than the async one and is bounded by a request deadline. If the
        provider does not answer within it, the response is a 408 and no charge
        is made.

        Every response returned after the job is created carries a
        `SmileID-Job-ID` header, and a completed screening can always be read
        back from `GET /v3/status/{jobId}` — so if you have a job id, read it
        rather than resubmitting. If you do not (a network failure, or the
        gateway timing the request out on its own), resubmit with the same
        `SmileID-Idempotency-Key`: the retry resolves to the same job and returns
        the original result instead of running a second, separately billed
        screening.
      parameters:
        - name: SmileID-Source-SDK
          in: header
          required: false
          description: Source SDK identifier.
          schema:
            type: string
            example: 'android'
        - name: SmileID-Source-SDK-Version
          in: header
          required: false
          description: Source SDK version.
          schema:
            type: string
            example: '10.4.2'
        - name: SmileID-Timestamp
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: >-
            ISO 8601 timestamp used as the salt when computing SmileID-Request-Signature.
            Required when your Smile ID account is configured to use SDK/partner secret HMAC
            authentication.
          schema:
            type: string
            format: date-time
            example: '2026-03-10T12:00:00.000Z'
        - name: SmileID-Request-Signature
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: >-
            HMAC signature of the raw HTTP request body, computed with your SDK/partner secret
            and the value of SmileID-Timestamp as salt. Required when your Smile ID
            account is configured to use SDK/partner secret HMAC authentication.
          schema:
            type: string
            example: '4f2d9c6b8a7e3f1c0d5e4b3a2c1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2'
        - name: User-ID
          in: header
          required: false
          description: >-
            Partner-provided user identifier. Must agree with body `user_id` and any
            token-bound user id — disagreement is a 403. If omitted everywhere, a TypeID
            is generated automatically.
          schema:
            type: string
        - name: SmileID-Idempotency-Key
          in: header
          required: false
          description: >-
            Opaque key, 16 to 128 characters of `A-Z a-z 0-9 - _`, that makes a
            submission safe to repeat. The job id is derived from it, so a request
            carrying a key you have already used resolves to that same job: it
            returns the original result and screens — and bills — nothing a second
            time. Send one whenever you might retry, since a retry without a key
            starts a new, separately billed screening.
          schema:
            type: string
            example: kuda-onboarding-8f14e45fceea167a
      requestBody:
        required: true
        description: >-
          Identical to `POST /v3/aml`, except that `callback_url` is optional
          because no callback is sent. Sent as multipart/form-data. Scalar
          fields (full_name, birth_year, strict_match, search_existing_user,
          user_id, source_sdk, source_sdk_version) are plain form fields.
          Non-scalar fields must be sent as JSON-encoded strings in their form
          part: the array fields countries and aliases (e.g.
          countries='["NG","KE"]') and the object fields consent, user_details,
          metadata, and partner_params. Multipart has no native array encoding,
          so a bare or repeated countries field is rejected — it must be a JSON
          array string.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OneTimeAmlRequest'
      responses:
        '200':
          description: >-
            Screening completed. The body is the terminal result — the same
            payload the async callback would have delivered.
          headers:
            Response-Signature:
              description: >-
                Signature over Response-Timestamp and your partner id, keyed with your API
                key. Identical in construction to the signature we send on webhooks, so
                existing verification code applies unchanged.
              schema:
                type: string
                example: 'Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZmdoaWo='
            Response-Timestamp:
              description: ISO 8601 timestamp the signature was computed over.
              schema:
                type: string
                format: date-time
                example: '2026-07-20T12:00:01.000Z'
            SmileID-Job-ID:
              description: The Smile job id for this screening.
              schema:
                type: string
                example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
            User-ID:
              description: The partner-scoped user id for this screening.
              schema:
                type: string
                example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeAmlCallback'
              examples:
                clear:
                  summary: '1031 — no matches found'
                  value:
                    status: clear
                    message: 'Screening completed: no matches found.'
                    reason: null
                    created_at: '2026-07-20T12:00:00.000Z'
                    completed_at: '2026-07-20T12:00:01.000Z'
                    product: one_time_aml
                    partner_params: null
                    kyc_receipt: 'https://receipts.smileidentity.com/...'
                    strict_match: true
                    no_of_persons_found: 0
                    people: []
                    user_provided_info:
                      given_names: Nkechi
                      last_name: Okafor
                      email: nkechi.okafor@example.com
                      phone_number: null
                    consent: {}
                    antifraud: null
                    device_signals: null
                block_match_found:
                  summary: '1030/1023 — potential match(es) identified'
                  value:
                    status: block
                    message: 'Screening completed: potential matches identified.'
                    reason: aml_match_found
                    created_at: '2026-07-20T12:00:00.000Z'
                    completed_at: '2026-07-20T12:00:01.000Z'
                    product: one_time_aml
                    partner_params: null
                    kyc_receipt: 'https://receipts.smileidentity.com/...'
                    strict_match: true
                    no_of_persons_found: 1
                    people:
                      - name: Gbenga Afolabi
                        addresses: []
                        adverse_media: []
                        aliases: []
                        associations: []
                        dates_of_birth: []
                        enforcement_actions: []
                        nationalities: []
                        sanctions:
                          - list: OFAC SDN
                        pep:
                          pep_level: 1
                          political_positions:
                            - Member of Parliament
                          sources: []
                    user_provided_info:
                      given_names: Gbenga
                      last_name: Afolabi
                      email: gbenga.afolabi@example.com
                      phone_number: null
                    consent: {}
                    antifraud: null
                    device_signals: null
                attention_adverse_media:
                  summary: '1017 — adverse media identified only'
                  value:
                    status: attention
                    message: 'Screening completed: adverse media identified only.'
                    reason: adverse_media_match
                    created_at: '2026-07-20T12:00:00.000Z'
                    completed_at: '2026-07-20T12:00:01.000Z'
                    product: one_time_aml
                    partner_params: null
                    kyc_receipt: 'https://receipts.smileidentity.com/...'
                    strict_match: true
                    no_of_persons_found: 1
                    people:
                      - name: Bukola Oni
                        addresses: []
                        adverse_media:
                          - title: Local business dispute reported in the press
                        aliases: []
                        associations: []
                        dates_of_birth: []
                        enforcement_actions: []
                        nationalities: []
                        sanctions: []
                        pep:
                          pep_level: null
                          political_positions: []
                          sources: []
                    user_provided_info:
                      given_names: Bukola
                      last_name: Oni
                      email: bukola.oni@example.com
                      phone_number: null
                    consent: {}
                    antifraud: null
                    device_signals: null
                block_high_risk:
                  summary: Fraud risk blocked the request before screening ran
                  value:
                    status: block
                    message: 'Verification failed.'
                    reason: high_risk
                    created_at: '2026-07-20T12:00:00.000Z'
                    completed_at: '2026-07-20T12:00:01.000Z'
                    product: one_time_aml
                    partner_params: null
                    kyc_receipt: 'https://receipts.smileidentity.com/...'
                    strict_match: true
                    no_of_persons_found: 0
                    people: []
                    user_provided_info:
                      given_names: Rashid
                      last_name: Omar
                      email: rashid.omar@example.com
                      phone_number: null
                    consent: {}
                    antifraud:
                      fraud_risk_level: high
                      fraud_risk_score: 92
                      fraud_risk_indicator_groups:
                        - device_risk
                    device_signals: null
        '400':
          description: Bad Request — validation error in request body or headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingCountries:
                  summary: Missing or invalid countries
                  value:
                    status: Bad Request
                    message: "Required field 'countries' is missing or invalid."
                missingFullName:
                  summary: Missing or invalid full_name
                  value:
                    status: Bad Request
                    message: "Required field 'full_name' is missing or invalid."
        '401':
          description: Unauthorized — invalid or missing authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unauthorized
                message: Invalid authentication credentials.
        '402':
          description: Payment Required — insufficient wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Payment Required
                message: You are out of credits. Add funds to your wallet to run more verifications.
        '403':
          description: >-
            Forbidden — product not enabled, IP not allowlisted, production access
            not granted, or a user id conflict between body, header, and token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                productNotEnabled:
                  summary: One-Time AML not enabled for this partner
                  value:
                    status: Forbidden
                    message: This feature requires you to activate ID Validation for your Smile ID account.
                ipNotAllowed:
                  summary: Caller IP not on the partner allowlist
                  value:
                    status: Forbidden
                    message: You are not authorized to do that.
        '404':
          description: >-
            Not Found — `search_existing_user` was true but no usable prior record
            exists for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                noEnrollee:
                  summary: No enrolled user for this partner
                  value:
                    status: Not Found
                    message: No enrolled user found for this partner.
                noUsablePriorRecord:
                  summary: No usable prior KYC record
                  value:
                    status: Not Found
                    message: No prior KYC record with a usable name and country was found for this user.
        '408':
          description: >-
            Request Timeout — the screening provider did not answer within the
            request deadline, so no result was produced and nothing is billed. The
            job exists and is terminal in `error`, so `GET /v3/status/{jobId}` will
            only ever return that error: resubmit rather than poll. Send
            `SmileID-Idempotency-Key` to make the resubmission safe to repeat.
          headers:
            SmileID-Job-ID:
              description: The Smile job id to poll for this screening.
              schema:
                type: string
                example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Request Timeout
                message: >-
                  The screening provider did not respond in time. The job is still recorded —
                  retrieve its result from /v3/status/{job_id}.
        '413':
          description: Content Too Large — the request payload exceeds the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Content Too Large
                message: Request payload is too large.
        '415':
          description: Unsupported Media Type — request must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unsupported Media Type
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
        '429':
          description: Too Many Requests — rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Too Many Requests
                message: Rate limit exceeded. Please try again later.
        '500':
          description: >-
            Internal Server Error. A screening that could not be completed for an
            internal reason is reported here rather than as a 200 carrying
            `status: error`. As with a 408, the job exists and its outcome can be
            read from `GET /v3/status/{jobId}`.
          headers:
            SmileID-Job-ID:
              description: >-
                The Smile job id to poll for this screening. Present when the failure
                happened after the job was created.
              schema:
                type: string
                example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Internal Server Error
                message: An unexpected error occurred. Please try again or contact support.
components:
  securitySchemes:
    SmileIDToken:
      type: apiKey
      in: header
      name: SmileID-Token
      description: JWT token obtained from `POST /v3/token`.
      x-gitbook-token-placeholder: YOUR_GENERATED_TOKEN
  schemas:
    OneTimeAmlRequest:
      type: object
      required:
        - countries
        - full_name
        - consent
        - user_details
      properties:
        user_id:
          type: string
          minLength: 1
          nullable: true
          description: >-
            Partner-provided user identifier. Optional in general; required when
            `search_existing_user` is `true`. Reconciled with the `User-ID` header and any
            token-bound user id after authentication — disagreement is a 403. Generated
            automatically as a TypeID when omitted everywhere.
          example: 'user-1234'
        countries:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 2
          description: >-
            ISO 3166-1 alpha-2 country codes (uppercase) to screen against. Remains
            authoritative for the screening even when `search_existing_user` is `true`.
            Sent as a JSON-encoded array string in the multipart part (e.g. `["NG","KE"]`).
          example: ['NG', 'KE']
        full_name:
          type: string
          minLength: 1
          description: >-
            Full name to screen. Remains authoritative for the screening — never replaced
            or compared with prior enrollee information, even when `search_existing_user`
            is `true`.
          example: 'John Doe'
        birth_year:
          type: string
          pattern: '^\d{4}$'
          nullable: true
          description: >-
            Optional four-digit birth year, minimum 1000 and maximum the current UTC year.
            A bare integer is also accepted. Full dates, decimals, non-four-digit values,
            and future years are rejected.
          example: '1990'
        strict_match:
          type: boolean
          default: true
          description: >-
            Optional. When `true` (default), uses the stricter match filter set; when
            `false`, uses a looser filter set. Accepts standard multipart boolean string
            representations (`"true"`/`"false"`). Always echoed back on the callback.
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 256
          description: >-
            Optional list of alternate names to screen, at most 20 entries, each at most
            256 characters. Sent as a JSON-encoded array string in the multipart part
            (e.g. `["Johnny Doe"]`).
          example: ['Johnny Doe']
        search_existing_user:
          type: boolean
          default: false
          description: >-
            Optional. A gate, not a data source: when `true`, requires the resolved
            `user_id` to belong to a partner-scoped, non-deleted enrollee with at least one
            non-expired prior KYC record carrying a usable name and country. It never
            overwrites `full_name`, `countries`, or `birth_year` — those stay authoritative.
            Accepts standard multipart boolean string representations.
        consent:
          $ref: '#/components/schemas/Consent'
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required: [email]
            - required: [phone_number]
          description: >-
            Consumer-stated PII fields for the screened user.
            Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              description: Given names of the individual.
              example: John
            last_name:
              type: string
              minLength: 1
              description: Last name / surname of the individual.
              example: Doe
            email:
              type: string
              format: email
              nullable: true
              description: >-
                Email address. At least one of email or phone_number is required.
              example: john@example.com
            phone_number:
              type: string
              pattern: '^\+[1-9]\d{6,14}$'
              nullable: true
              description: Phone number in E.164 format (must start with +). At least one of email or phone_number is required.
              example: '+2348012345678'
        callback_url:
          type: string
          format: uri
          pattern: '^https://'
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted.
            Must be on the partner's allowed callback domains list.
          example: https://example.com/callback
        partner_params:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata for partner reference.
          example:
            order_id: 'ORD-12345'
        metadata:
          type: array
          description: Additional metadata entries.
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
        source_sdk:
          type: string
          description: Source SDK identifier. Can also be provided via the `SmileID-Source-SDK` header.
          example: android
        source_sdk_version:
          type: string
          description: Source SDK version. Can also be provided via the `SmileID-Source-SDK-Version` header.
          example: '10.4.2'
    Consent:
      type: object
      required:
        - granted
        - granted_at
        - notice_language
        - notice_privacy_policy_url
      properties:
        granted:
          type: boolean
          enum: [true]
          description: Must be true; user has granted consent.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when consent was granted.
          example: '2026-03-06T12:00:00.000Z'
        notice_language:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
          description: ISO 639-1 language code of the privacy notice shown, uppercase.
          example: EN
        notice_privacy_policy_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL of the privacy policy notice shown to the user.
          example: https://example.com/privacy

    OneTimeAmlAcceptedResponse:
      type: object
      required:
        - status
        - message
        - job_id
        - user_id
      properties:
        status:
          type: string
          enum: [accepted]
          description: Acceptance status for the queued screening request.
        message:
          type: string
          enum: ['Job submitted successfully']
          description: Human-readable acceptance message.
        job_id:
          type: string
          description: TypeID format verification identifier for tracking.
          example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
        user_id:
          type: string
          description: TypeID format user identifier, or the reconciled partner-provided user identifier.
          example: user_01h8x9y2z3a4b5c6d7e8f9g0h1

    AmlPersonMatch:
      type: object
      description: >-
        A single sanctions/PEP/adverse-media hit. Public snake_case fields only — internal
        provider references (e.g. sigma_ref) are always stripped before the callback is sent.
      additionalProperties: true
      properties:
        name:
          type: string
        addresses:
          type: array
          items:
            type: object
            additionalProperties: true
        adverse_media:
          type: array
          items:
            type: object
            additionalProperties: true
        aliases:
          type: array
          items:
            type: object
            additionalProperties: true
        associations:
          type: array
          items:
            type: object
            additionalProperties: true
        dates_of_birth:
          type: array
          items:
            type: object
            additionalProperties: true
        enforcement_actions:
          type: array
          items:
            type: object
            additionalProperties: true
        nationalities:
          type: array
          items:
            type: object
            additionalProperties: true
        sanctions:
          type: array
          items:
            type: object
            additionalProperties: true
        pep:
          type: object
          properties:
            pep_level:
              type: integer
              nullable: true
            political_positions:
              type: array
              items:
                type: string
            sources:
              type: array
              items:
                type: object
                additionalProperties: true

    OneTimeAmlCallback:
      type: object
      required:
        - status
        - message
        - reason
        - created_at
        - product
        - partner_params
        - kyc_receipt
        - strict_match
        - no_of_persons_found
        - people
        - user_provided_info
        - consent
        - antifraud
        - device_signals
      properties:
        status:
          type: string
          enum: [clear, block, attention, error]
          description: Terminal outcome of the screening.
        message:
          type: string
          description: Canonical human-readable outcome message.
          example: 'Screening completed: no matches found.'
        reason:
          type: string
          nullable: true
          description: >-
            Canonical machine-readable reason. `null` for a clear outcome.
          enum: [null, aml_match_found, adverse_media_match, service_unavailable, high_risk]
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp the screening job started processing.
        completed_at:
          type: string
          format: date-time
          description: >-
            ISO 8601 timestamp the terminal outcome was reached. Omitted only if the terminal
            state could not be read.
        product:
          type: string
          enum: [one_time_aml]
        partner_params:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: >-
            Partner-supplied key-value metadata, with internal transport keys
            (`_sandbox_v3`, `job_id`, `job_type`, `user_id`) stripped. `null` when empty.
        kyc_receipt:
          type: string
          nullable: true
          description: >-
            Signed receipt URL. `null` on submission; populated for `clear`, `block`, and
            `attention` outcomes. Remains `null` for `error`.
        strict_match:
          type: boolean
          description: The resolved `strict_match` value used for the screening.
        no_of_persons_found:
          type: integer
          description: Count of sanctions/PEP/adverse-media matches found.
        people:
          type: array
          items:
            $ref: '#/components/schemas/AmlPersonMatch'
        user_provided_info:
          type: object
          required:
            - given_names
            - last_name
            - email
            - phone_number
          properties:
            given_names:
              type: string
              nullable: true
            last_name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            phone_number:
              type: string
              nullable: true
        consent:
          type: object
          additionalProperties: true
          description: ISO 27560 consent record for the granted consent.
        antifraud:
          type: object
          nullable: true
          additionalProperties: true
          description: Antifraud risk assessment. `null` when no scored fraud result exists for the job.
        device_signals:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Device/network signals captured at submission time. Always `null` for an `error`
            outcome, and best-effort `null` when no metadata was captured.

    ApiErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: HTTP status text.
          example: Bad Request
        message:
          type: string
          description: Human-readable error message.
          example: Invalid request.
