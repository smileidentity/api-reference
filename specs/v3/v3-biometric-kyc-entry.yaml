openapi: 3.0.0
info:
  title: V3 Biometric KYC Entry API
  version: '1.0.0'
  description: >-
    Async Biometric KYC endpoint combining biometric verification with KYC identity checks.
    Accepts a selfie image, liveness images, and ID details, validates at entry, and processes
    the verification asynchronously (passive liveness, active liveness, and ID authority verification).
    Returns HTTP 202 with a job_id and user_id to track the result via callback.

    Authentication: token-based (token header from /v3/token).

    At least one of `email` or `phone_number` is required.
paths:
  /v3/biometric_kyc:
    post:
      summary: Submit Biometric KYC verification
      operationId: v3BiometricKycEntry
      description: >-
        Combines biometric selfie verification with KYC identity checks against the
        relevant ID authority. The selfie and liveness images are uploaded alongside
        identity details (country, id_type, id_number), validated at entry, then processed
        asynchronously.
        Results are delivered via callback URL.
      parameters:
        - name: SmileID-Partner-ID
          in: header
          required: true
          description: Partner identifier (numeric, 3+ digits).
          schema:
            type: string
            pattern: '^\d{3,}$'
            example: '1234'
        - name: SmileID-Token
          in: header
          required: true
          description: JWT token from /v3/token.
          schema:
            type: string
        - name: SmileID-Source-SDK
          in: header
          required: false
          description: Source SDK identifier.
          schema:
            type: string
            example: 'android'
        - name: SmileID-Source-SDK-Version
          in: header
          required: false
          description: Source SDK version.
          schema:
            type: string
            example: '10.4.2'
        - name: SmileID-Timestamp
          in: header
          required: false
          description: >-
            ISO 8601 timestamp used as the salt when computing SmileID-Request-Signature.
            Required when your Smile ID account is configured to use SDK/partner secret HMAC
            authentication.
          schema:
            type: string
            format: date-time
            example: '2026-03-10T12:00:00.000Z'
        - name: SmileID-Request-Signature
          in: header
          required: false
          description: >-
            HMAC signature of the raw HTTP request body, computed with your SDK/partner secret
            and the value of SmileID-Timestamp as salt. Required when your Smile ID
            account is configured to use SDK/partner secret HMAC authentication.
          schema:
            type: string
            example: '4f2d9c6b8a7e3f1c0d5e4b3a2c1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2'
        - name: User-ID
          in: header
          required: false
          description: >-
            Partner-provided user identifier. If omitted, a TypeID is generated automatically.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BiometricKycRequest'
            encoding:
              selfie_image:
                contentType: image/jpeg
              liveness_images:
                contentType: image/jpeg
      responses:
        '202':
          description: Accepted — verification submitted for async processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              example:
                status: accepted
                message: Request accepted and queued for processing.
                job_id: job_01h8x9y2z3a4b5c6d7e8f9g0h1
                user_id: user_01h8x9y2z3a4b5c6d7e8f9g0h1
                created_at: '2026-03-10T12:00:00.000Z'
        '400':
          description: Bad Request — validation error in request body or headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSelfie:
                  summary: Missing selfie image
                  value:
                    status: Bad Request
                    message: "Required field 'selfie_image' is missing or invalid."
                missingCallbackUrl:
                  summary: Missing callback_url and no default set
                  value:
                    status: Bad Request
                    message: A valid callback_url is required in the request or a default callback URL must be configured in the portal.
                missingCountry:
                  summary: Missing required field
                  value:
                    status: Bad Request
                    message: "Required field 'country' is missing or invalid."
                missingContact:
                  summary: Missing email and phone
                  value:
                    status: Bad Request
                    message: Either email or phone_number is required.
                invalidConsent:
                  summary: Consent not granted
                  value:
                    status: Bad Request
                    message: "Required field 'consent.granted' is missing or invalid."
                invalidIdFormat:
                  summary: Invalid ID number format
                  value:
                    status: Bad Request
                    message: Invalid ID number format for the specified country and ID type.
        '401':
          description: Unauthorized — invalid or missing authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Unauthorized
                message: Invalid authentication credentials.
        '402':
          description: Payment Required — insufficient wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Payment Required
                message: Insufficient wallet balance.
        '403':
          description: Forbidden — partner not authorized for this product, ID type, or IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                productAccess:
                  summary: Product not enabled
                  value:
                    status: Forbidden
                    message: Product not enabled for this partner.
                idTypeDisabled:
                  summary: ID type not enabled
                  value:
                    status: Forbidden
                    message: ID type not enabled for this partner.
                productionAccess:
                  summary: Production access denied
                  value:
                    status: Forbidden
                    message: Production access is not enabled.
                sdkVersion:
                  summary: SDK version blocked
                  value:
                    status: Forbidden
                    message: SDK version not allowed.
        '413':
          description: Content Too Large — an uploaded file exceeds the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Content Too Large
                message: selfie_image is too large.
        '415':
          description: Unsupported Media Type — request must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Unsupported Media Type
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
        '429':
          description: Too Many Requests — rate limit exceeded for this ID number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Too Many Requests
                message: Rate limit exceeded. Please try again later.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Internal Server Error
                message: An unexpected error occurred. Please try again or contact support.

components:
  schemas:
    BiometricKycRequest:
      type: object
      required:
        - selfie_image
        - liveness_images
        - consent
        - country
        - id_type
        - id_number
        - user_details
      properties:
        selfie_image:
          type: string
          format: binary
          description: >-
            JPEG selfie image used for biometric verification.
            Must be a clear, well-lit, front-facing photo.
        liveness_images:
          type: array
          minItems: 6
          maxItems: 8
          items:
            type: string
            format: binary
          description: >-
            Array of JPEG liveness sequence images captured during the liveness check.
            These images are used for passive and active liveness verification.
        consent:
          $ref: '#/components/schemas/Consent'
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (uppercase).
          example: NG
        id_type:
          type: string
          description: ID document type (e.g., NIN, BVN, DRIVERS_LICENSE).
          example: NIN
        id_number:
          type: string
          description: ID document number. Must match the regex format for the country/id_type.
          example: '12345678901'
        user_details:
          type: object
          required:
            - given_names
            - last_name
          description: >-
            Consumer-stated PII fields for the user.
            Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              description: Given name(s) / first name of the individual.
              example: John
            last_name:
              type: string
              minLength: 1
              description: Last name / surname of the individual.
              example: Doe
            email:
              type: string
              format: email
              nullable: true
              description: >-
                Email address of the individual.
                At least one of email or phone_number is required.
              example: john@example.com
            phone_number:
              type: string
              pattern: '^\+[1-9]\d{6,14}$'
              nullable: true
              description: >-
                Phone number in E.164 format (must start with +).
                At least one of email or phone_number is required.
              example: '+2348012345678'
        callback_url:
          type: string
          format: uri
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted.
            Must be on the partner's allowed callback domains list.
          example: https://example.com/callback
        sandbox_result:
          type: number
          description: >-
            Force a specific result code in sandbox/test environments.
            Only effective when the partner account is in sandbox mode.
          example: 1220
        partner_params:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata for partner reference.
          example:
            order_id: 'ORD-12345'
        metadata:
          type: array
          description: Additional metadata entries (e.g., SDK telemetry, device info).
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000

    Consent:
      type: object
      required:
        - granted
        - granted_at
        - notice_language
        - notice_privacy_policy_url
      properties:
        granted:
          type: boolean
          enum: [true]
          description: Must be true — user has granted consent.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when consent was granted.
          example: '2026-03-06T12:00:00.000Z'
        notice_language:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
          description: ISO 639-1 language code of the privacy notice shown (uppercase).
          example: EN
        notice_privacy_policy_url:
          type: string
          format: uri
          description: URL of the privacy policy notice shown to the user.
          example: https://example.com/privacy

    AcceptedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted]
        message:
          type: string
          example: Request accepted and queued for processing.
        job_id:
          type: string
          description: TypeID format verification identifier for tracking.
          example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
        user_id:
          type: string
          description: TypeID format user identifier (or partner-provided User-ID).
          example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the verification was created.
          example: '2026-03-10T12:00:00.000Z'

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: HTTP status text.
          example: Bad Request
        message:
          type: string
          description: Human-readable error description.
          example: "Required field 'country' is missing or invalid."
