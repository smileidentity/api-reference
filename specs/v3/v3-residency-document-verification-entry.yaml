openapi: 3.0.3
servers:
  - url: https://testapi.smileidentity.com
    description: Sandbox
  - url: https://api.smileidentity.com
    description: Production
info:
  contact:
    name: Smile ID Support
    url: https://docs.usesmileid.com
    email: support@usesmileid.com
  title: V3 Residency Document Verification API
  version: '1.0.0'
  description: >-
    Async Residency Document Verification endpoint. Accepts everything standard Document Verification takes — a selfie image, liveness images and a passport image (front, and optionally back) — plus the visa endorsed in that passport. Both documents are read: the passport is verified first, and the visa is then read and verified. The id_type field is required and must be PASSPORT — a visa can only be endorsed in a passport, so no other document type is accepted. Returns HTTP 202 with a job_id and user_id to track the result via callback.

    Expect results to take longer to arrive than standard Document Verification, and rely on the callback rather than polling.

    If the identity document itself fails verification, the job fails there and the visa is never read.

    Authentication: token-based (token header from /v3/token).

    At least one of `email` or `phone_number` is required.

    Token Payload: Identity fields (country, id_type, given_names, last_name, email, phone_number, callback_url) and the ISO 27560 consent fields can be bound to the authentication token via the token payload feature at /v3/token (PII fields are held as opaque references, never raw values). When present in the token, these fields are injected automatically and override any values in the request body. Fields provided via the token do not need to be repeated in the request body; GET /v3/services/config lists them as token_provided_fields.

    Encrypted SDK package: when a request is captured by a Smile ID SDK and forwarded by the partner's backend, the SDK can encrypt the request fields and headers into `encrypted_package` (with `package_nonce` and `package_tag`). The partner forwards these three form fields unchanged, alongside the image files and the SmileID-Source-SDK and SmileID-Source-SDK-Version headers. Smile ID decrypts the package before validation, so required fields may be supplied inside the package instead of as plain form fields. A package that cannot be decrypted or parsed is rejected with HTTP 422.

    The partner may add form fields and files of its own alongside the package, such as `callback_url`. The payload signature does not cover them: it covers only the package and the SDK-captured images (`selfie_image`, `liveness_images`, `document`, `document_back` and `visa`), which must come from the SDK. A field that also appears in the package must agree with it. Objects such as `partner_params` may gain extra keys, but any other difference is rejected with HTTP 422, naming the field.
tags:
  - name: Residency Document Verification
paths:
  /v3/residency_document_verification:
    post:
      summary: Submit Residency Document Verification
      operationId: v3ResidencyDocumentVerificationEntry
      tags:
        - Residency Document Verification
      security:
        - SmileIDToken: []
      description: >-
        Verifies a user's identity by comparing a selfie against a passport image, and additionally reads the visa endorsed in that passport. The selfie and liveness images are uploaded alongside a passport photo (front, and optionally back) and the visa. The id_type is required and must be PASSPORT. Results might take longer than the standard Document Verification product and are delivered asynchronously via callback URL.
      parameters:
        - name: SmileID-Partner-ID
          in: header
          required: true
          description: Partner identifier (numeric, 3+ digits).
          schema:
            type: string
            pattern: '^\d{3,}$'
            example: '1234'
        - name: SmileID-Source-SDK
          in: header
          required: false
          description: >-
            Source SDK identifier. Required when `encrypted_package` is supplied, together with SmileID-Source-SDK-Version, to select the decryption key.
          schema:
            type: string
            example: 'android'
        - name: SmileID-Source-SDK-Version
          in: header
          required: false
          description: >-
            Source SDK version. Required when `encrypted_package` is supplied, together with SmileID-Source-SDK, to select the decryption key.
          schema:
            type: string
            example: '10.4.2'
        - name: SmileID-Timestamp
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: >-
            ISO 8601 timestamp used as the salt when computing SmileID-Request-Signature. Required when your Smile ID account is configured to use SDK/partner secret HMAC authentication. May be supplied inside `encrypted_package` instead of as a plain header.
          schema:
            type: string
            format: date-time
            example: '2026-03-10T12:00:00.000Z'
        - name: SmileID-Request-Signature
          in: header
          required: false
          x-smile-sdk-exclude: true
          description: >-
            HMAC signature of the raw HTTP request body, computed with your SDK/partner secret and the value of SmileID-Timestamp as salt. Required when your Smile ID account is configured to use SDK/partner secret HMAC authentication.
          schema:
            type: string
            example: '4f2d9c6b8a7e3f1c0d5e4b3a2c1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2'
        - name: User-ID
          in: header
          required: false
          description: >-
            Partner-provided user identifier. If omitted, a TypeID is generated automatically.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResidencyDocumentVerificationRequest'
            encoding:
              selfie_image:
                contentType: image/jpeg
              liveness_images:
                contentType: image/jpeg
              document:
                contentType: image/jpeg, image/png
              document_back:
                contentType: image/jpeg, image/png
              visa:
                contentType: image/jpeg, image/png
      callbacks:
        residencyDocumentVerificationResult:
          '{$request.body#/callback_url}':
            post:
              summary: Residency Document Verification result callback
              description: >-
                The standard Document Verification callback body, plus an `additional_documents` array carrying what was read from the visa. Only this product sends that key; plain and Enhanced Document Verification omit it entirely. The array is populated only when the job reaches `clear` or `attention` — on `block` or `error` the key is present but empty, matching how `id_fields` is suppressed on a failed outcome. Only the visa-specific part of the body is specified here; every other field matches the Document Verification callback. It also carries `match_fields`, comparing the visa with the passport; a mismatch blocks the job with reason `cross_document_mismatch` when both fields differ, `cross_document_name_mismatch` when the visa carries only a name and it differs, or `cross_document_id_number_mismatch` when the visa carries only an ID number and it differs.


                The reason says which document caused the outcome. `document_check_failed`, `document_expired` and `document_copy_detected` are about the passport alone. A rejected visa blocks with `visa_check_failed`. An expired visa returns `attention` with `visa_expired`, and a photocopied visa with `visa_copy_detected`. When both documents have expired the reason is `document_visa_expired`, and when both are photocopies it is `document_visa_copy_detected`. Expiry is reported ahead of a photocopy.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ResidencyDocumentVerificationCallback'
                    examples:
                      clear:
                        summary: Visa read on a clear outcome
                        value:
                          status: clear
                          product: residency_document_verification
                          additional_documents:
                            - image_link: https://smile-results.s3.eu-west-1.amazonaws.com/.../additional_doc_1.jpg?...
                              full_name: John D.
                              id_number: A000000X
                              issued_at: Head office
                              issuance_date: '2025-01-15'
                              expiry:
                                expiry_date: '2025-10-15'
                                expiry_period_in_months: '9'
                              conditions: >-
                                The holder is not or does not become a prohibited or undesirable person. To conduct work as a human resource officer.
                              no_of_entries: multiple
                              document_primary_id: AA0789993
                          match_fields:
                            decision: MATCH
                            id_number_to_visa_match:
                              result: MATCH
                              id_value: A000000X
                              visa_value: A000000X
                            last_name_match:
                              result: PARTIAL
                              id_value: Doe
                              visa_value: John D.
                      blocked:
                        summary: Suppressed on a non-clear outcome
                        value:
                          status: block
                          product: residency_document_verification
                          additional_documents: []
              responses:
                '200':
                  description: Callback received and acknowledged by the partner endpoint.
      responses:
        '202':
          description: Accepted — job submitted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              example:
                status: accepted
                message: Request accepted and queued for processing.
                job_id: job_01h8x9y2z3a4b5c6d7e8f9g0h1
                user_id: user_01h8x9y2z3a4b5c6d7e8f9g0h1
                created_at: '2026-03-10T12:00:00.000Z'
        '400':
          description: Bad Request — validation error in request body or headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingDocument:
                  summary: Missing document image
                  value:
                    status: Bad Request
                    message: "Required field 'document' is missing or invalid."
                missingVisa:
                  summary: Missing visa image
                  value:
                    status: Bad Request
                    message: "Required field 'visa' is missing or invalid."
                missingSelfie:
                  summary: Missing selfie image
                  value:
                    status: Bad Request
                    message: "Required field 'selfie_image' is missing or invalid."
                missingCallbackUrl:
                  summary: Missing callback_url and no default set
                  value:
                    status: Bad Request
                    message: A valid callback_url is required in the request or a default callback URL must be configured in the portal.
                missingCountry:
                  summary: Missing required field
                  value:
                    status: Bad Request
                    message: "Required field 'country' is missing or invalid."
                missingContact:
                  summary: Missing email and phone
                  value:
                    status: Bad Request
                    message: Either email or phone_number is required.
                invalidConsent:
                  summary: Consent not granted
                  value:
                    status: Bad Request
                    message: "Required field 'consent.granted' is missing or invalid."
                missingIdType:
                  summary: Missing id_type
                  value:
                    status: Bad Request
                    message: "Required field 'id_type' is missing or invalid."
                invalidIdType:
                  summary: id_type is not PASSPORT
                  value:
                    status: Bad Request
                    message: "Field 'id_type' must be PASSPORT for residency document verification."
                invalidDocumentMime:
                  summary: Invalid document image format
                  value:
                    status: Bad Request
                    message: Document image must be JPEG or PNG.
        '401':
          description: Unauthorized — invalid or missing authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unauthorized
                message: Invalid authentication credentials.
        '402':
          description: Payment Required — insufficient wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Payment Required
                message: Insufficient wallet balance.
        '403':
          description: Forbidden — partner not authorized for this product or IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                productAccess:
                  summary: Product not enabled
                  value:
                    status: Forbidden
                    message: Product not enabled for this partner.
                productionAccess:
                  summary: Production access denied
                  value:
                    status: Forbidden
                    message: Production access is not enabled.
                sdkVersion:
                  summary: SDK version blocked
                  value:
                    status: Forbidden
                    message: SDK version not allowed.
        '413':
          description: Content Too Large — an uploaded file exceeds the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Content Too Large
                message: selfie_image is too large.
        '415':
          description: Unsupported Media Type — request must be multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unsupported Media Type
                message: Unsupported Media Type. Required Content-Type is multipart/form-data
        '422':
          description: >-
            Unprocessable Content — the encrypted SDK package could not be decrypted or parsed. Returned when `encrypted_package` is supplied and `package_nonce` or `package_tag` is missing or the wrong length, the SmileID-Source-SDK or SmileID-Source-SDK-Version header is missing or unrecognised, or decryption or JSON parsing fails, or a form field sent alongside the package conflicts with a field inside it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Unprocessable Content
                message: Invalid payload.
        '429':
          description: Too Many Requests — rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Too Many Requests
                message: Rate limit exceeded. Please try again later.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: Internal Server Error
                message: An unexpected error occurred. Please try again or contact support.
components:
  securitySchemes:
    SmileIDToken:
      type: apiKey
      in: header
      name: SmileID-Token
      description: JWT token obtained from `POST /v3/token`.
      x-gitbook-token-placeholder: YOUR_GENERATED_TOKEN
  schemas:
    ResidencyDocumentVerificationRequest:
      type: object
      required:
        - selfie_image
        - liveness_images
        - consent
        - country
        - document
        - visa
        - id_type
        - user_details
      properties:
        selfie_image:
          type: string
          format: binary
          description: >-
            JPEG selfie image used for biometric verification. Must be a clear, well-lit, front-facing photo.
        liveness_images:
          type: array
          minItems: 6
          maxItems: 8
          items:
            type: string
            format: binary
          description: >-
            Array of JPEG liveness sequence images captured during the liveness check. These images are used for liveness verification.
        document:
          type: string
          format: binary
          description: >-
            Front of the identity document (JPEG or PNG). Used for document verification.
        document_back:
          type: string
          format: binary
          description: >-
            Back of the identity document (JPEG or PNG). Optional. Provide when the document has relevant information on the back (e.g., barcodes, MRZ on some document types).
        visa:
          type: string
          format: binary
          description: >-
            The visa endorsed in the identity document (JPEG or PNG). Required. Capture the visa page itself, not the document's biographical page — the two are read separately and a second copy of the biographical page cannot be reviewed as a visa.
        consent:
          $ref: '#/components/schemas/Consent'
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: >-
            ISO 3166-1 alpha-2 country code (uppercase). Can be provided via the token payload (bound at /v3/token) instead of the request body.
          example: NG
        id_type:
          type: string
          enum: [PASSPORT]
          description: >-
            Type of the identity document the visa is endorsed in. Required, and must be PASSPORT — a visa can only be endorsed in a passport, so no other value is accepted. This describes the identity document, never the visa; the visa's own class is determined during verification. Can be provided via the token payload (bound at /v3/token) instead of the request body.
          example: PASSPORT
        user_details:
          type: object
          required:
            - given_names
            - last_name
          anyOf:
            - required: [email]
            - required: [phone_number]
          description: >-
            Consumer-stated PII fields for the user. Either email or phone_number must be provided.
          properties:
            given_names:
              type: string
              minLength: 1
              description: >-
                Given name(s) / first name of the individual. Can be provided via the token payload (bound at /v3/token) instead of the request body.
              example: John
            last_name:
              type: string
              minLength: 1
              description: >-
                Last name / surname of the individual. Can be provided via the token payload (bound at /v3/token) instead of the request body.
              example: Doe
            email:
              type: string
              format: email
              nullable: true
              description: >-
                Email address of the individual. At least one of email or phone_number is required. Can be provided via the token payload (bound at /v3/token) instead of the request body.
              example: john@example.com
            phone_number:
              type: string
              pattern: '^\+[1-9]\d{6,14}$'
              nullable: true
              description: >-
                Phone number in E.164 format (must start with +). At least one of email or phone_number is required.
              example: '+2348012345678'
        callback_url:
          type: string
          format: uri
          pattern: '^https://'
          description: >-
            URL to receive the async result callback. Falls back to partner default if omitted. Must be on the partner's allowed callback domains list. Can be provided via the token payload (bound at /v3/token) instead of the request body.
          example: https://example.com/callback
        partner_params:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata for partner reference.
          example:
            order_id: 'ORD-12345'
        encrypted_package:
          type: string
          pattern: '^[0-9a-fA-F]+$'
          description: >-
            Encrypted package produced by a Smile ID SDK. Forward it unchanged. When present, `package_nonce` and `package_tag` and the SmileID-Source-SDK and SmileID-Source-SDK-Version headers are required.
          example: '9f3c1a7e52b08d46e1f27a9c3b5d80e4a6c2f19b7d3e05a8c4'
        package_nonce:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: >-
            Nonce for `encrypted_package`, produced by a Smile ID SDK. Forward it unchanged. Required when `encrypted_package` is supplied.
          example: '0a1b2c3d4e5f60718293a4b5'
        package_tag:
          type: string
          pattern: '^[0-9a-fA-F]{32}$'
          description: >-
            Tag for `encrypted_package`, produced by a Smile ID SDK. Forward it unchanged. Required when `encrypted_package` is supplied.
          example: '00112233445566778899aabbccddeeff'
        metadata:
          type: array
          description: Additional metadata entries (e.g., SDK telemetry, device info).
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
    Consent:
      type: object
      required: [granted, granted_at, notice_language, notice_privacy_policy_url]
      properties:
        granted:
          type: boolean
          enum: [true]
          description: Must be true; user has granted consent.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when consent was granted.
          example: '2026-03-06T12:00:00.000Z'
        notice_language:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
          description: ISO 639-1 language code of the privacy notice shown, uppercase.
          example: EN
        notice_privacy_policy_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL of the privacy policy notice shown to the user.
          example: https://example.com/privacy
    AcceptedResponse:
      type: object
      required:
        - status
        - message
        - job_id
        - user_id
        - created_at
      properties:
        status:
          type: string
          enum: [accepted]
          description: Acceptance status for queued verification requests.
        message:
          type: string
          description: Human-readable acceptance message.
          example: Request accepted and queued for processing.
        job_id:
          type: string
          description: TypeID format verification identifier for tracking.
          example: job_01h8x9y2z3a4b5c6d7e8f9g0h1
        user_id:
          type: string
          description: TypeID format user identifier, or partner-provided user identifier.
          example: user_01h8x9y2z3a4b5c6d7e8f9g0h1
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the verification was created.
          example: '2026-03-10T12:00:00.000Z'
    ApiErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: HTTP status text.
          example: Bad Request
        message:
          type: string
          description: Human-readable error message.
          example: Invalid request.
    ResidencyDocumentVerificationCallback:
      type: object
      description: >-
        The Document Verification callback body as sent for Residency Document Verification. Only the fields specific to this product are described; the rest match the standard Document Verification callback.
      properties:
        status:
          type: string
          enum: [clear, attention, block, error]
          description: Terminal state of the job.
        product:
          type: string
          enum: [residency_document_verification]
        additional_documents:
          type: array
          description: >-
            Documents read alongside the one that identifies the job. Present only on this product, and populated only when `status` is `clear` or `attention`. Empty on any other outcome, or when nothing could be read from the visa.
          items:
            $ref: '#/components/schemas/AdditionalDocument'
        match_fields:
          $ref: '#/components/schemas/MatchFields'
    MatchFields:
      type: object
      description: >-
        How the visa in `additional_documents` compares with the passport in `id_fields`. Present only on this product, and only when `additional_documents` carries a visa (`clear` or `attention`). When the visa does not carry a field it is reported as `NOT_PRESENT`; the passport always carries both.
      properties:
        decision:
          type: string
          enum: [MATCH, PARTIAL_MATCH, NO_MATCH, SINGLE_FIELD_MATCH, FIELD_NOT_PRESENT]
          description: >-
            The two field results rolled up. `MATCH` clears; `PARTIAL_MATCH` (one of two fields matches), `SINGLE_FIELD_MATCH` (the visa carries one field and it matches) and `FIELD_NOT_PRESENT` (the visa carries neither) return `attention` with reasons `cross_document_partial_match`, `cross_document_single_field_match` and `cross_document_fields_not_present`. `NO_MATCH` blocks the job with reason `cross_document_mismatch`, `cross_document_name_mismatch` or `cross_document_id_number_mismatch`, so it is never seen here.
        id_number_to_visa_match:
          $ref: '#/components/schemas/FieldMatch'
        last_name_match:
          $ref: '#/components/schemas/FieldMatch'
    FieldMatch:
      type: object
      description: One field compared across the two documents, with the values compared.
      properties:
        result:
          type: string
          enum: [MATCH, PARTIAL, NO_MATCH, NOT_PRESENT]
          description: >-
            ID numbers are compared exactly, ignoring case, spaces and hyphens. The last name is looked for anywhere in the visa's printed name; `PARTIAL` means it is within two edits (Levenshtein distance) and counts as a match in `decision`.
        id_value:
          type: string
          nullable: true
          description: The value from the passport (`id_fields`).
          example: A000000X
        visa_value:
          type: string
          nullable: true
          description: >-
            The value from the visa (`additional_documents`). For the last name this is the visa's full printed name, which the last name is matched within.
          example: A000000X
    AdditionalDocument:
      type: object
      description: A document read alongside the one that identifies the job.
      properties:
        image_link:
          type: string
          nullable: true
          description: Time-limited signed URL to the document image.
          example: https://smile-results.s3.eu-west-1.amazonaws.com/.../additional_doc_1.jpg?...
        full_name:
          type: string
          nullable: true
          description: Name as printed on the document. Null when absent or obscured.
          example: John D.
        id_number:
          type: string
          nullable: true
          description: The number identifying the holder. Null when absent or obscured.
          example: A000000X
        issued_at:
          type: string
          nullable: true
          description: Issuing office as printed.
          example: Head office
        issuance_date:
          type: string
          format: date
          nullable: true
          description: >-
            Date of issue. Where the document prints a validity start rather than an issue date, that value is returned here.
          example: '2025-01-15'
        expiry:
          type: object
          properties:
            expiry_date:
              type: string
              format: date
              nullable: true
              example: '2025-10-15'
            expiry_period_in_months:
              type: string
              nullable: true
              description: >-
                Complete months between the start of validity and expiry. Null unless both dates were read.
              example: '9'
        conditions:
          type: string
          nullable: true
          description: Conditions or restrictions printed on the document, verbatim.
        no_of_entries:
          type: string
          enum: [single, multiple, other]
          nullable: true
          description: Null when the document carries no entries field, or names something outside this list.
          example: multiple
        document_primary_id:
          type: string
          nullable: true
          description: The control or permit number.
          example: AA0789993
