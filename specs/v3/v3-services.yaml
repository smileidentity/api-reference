openapi: 3.0.3
info:
  title: V3 Services API
  version: 1.0.0
  description: |
    Reference endpoints that return configuration and status data: bank codes, supported ID types,
    supported documents, and ID type availability status.

    Most endpoints do not require authentication. The `GET /v3/services/id_status` endpoint
    requires a JWT token passed in the `SmileID-Token` header.

components:
  parameters:
    CountryFilter:
      name: country
      in: query
      required: false
      description: |
        ISO 3166-1 alpha-2 country code (two uppercase letters). When provided, only
        items matching this country are returned. When omitted, all items are returned.
      schema:
        type: string
        pattern: '^[A-Z]{2}$'
        example: NG

  securitySchemes:
    SmileIDToken:
      type: apiKey
      in: header
      name: SmileID-Token
      description: JWT token obtained from `POST /v3/token`.

  schemas:
    BankCode:
      type: object
      required:
        - code
        - country
        - name
      properties:
        code:
          type: string
          description: Numeric bank code assigned by the country's central bank.
          example: '044'
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        name:
          type: string
          description: Human-readable bank name.
          example: Access Bank

    BankCodesResponse:
      type: object
      properties:
        bank_codes:
          type: array
          items:
            $ref: '#/components/schemas/BankCode'

    SupportedIdType:
      type: object
      required:
        - country
        - type
        - label
        - regex
      properties:
        bank_code:
          type: string
          description: |
            Bank code required for this ID type. Only present for ID types that are
            bank-specific (e.g. `BANK_ACCOUNT`).
          example: '044'
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        label:
          type: string
          description: Human-readable label for the ID type.
          example: Bank Verification Number
        regex:
          type: string
          description: |
            Regular expression pattern (without delimiters) that the ID number must
            match for this ID type.
          example: '^\d{11}$'
        required_fields:
          type: array
          items:
            type: string
          description: |
            List of field names that must be provided when submitting a verification
            request for this ID type (e.g. `first_name`, `last_name`, `dob`).
          example:
            - first_name
            - last_name
            - dob
        type:
          type: string
          description: Machine-readable ID type code.
          example: BVN

    SupportedIdTypesResponse:
      type: object
      properties:
        id_types:
          type: array
          items:
            $ref: '#/components/schemas/SupportedIdType'

    Country:
      type: object
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: NG
        name:
          type: string
          description: Country name.
          example: Nigeria
        continent:
          type: string
          description: Continent name.
          example: AFRICA

    IDType:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable ID type code.
          example: DRIVERS_LICENSE
        name:
          type: string
          description: Human-readable name of the ID type.
          example: Driver's License
        example:
          type: array
          items:
            type: string
          description: Example ID numbers or usage hints.
        has_back:
          type: boolean
          description: Whether this document type has a back side that should be captured.
          example: true

    SupportedDocument:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/Country'
        id_types:
          type: array
          items:
            $ref: '#/components/schemas/IDType'

    SupportedDocumentsResponse:
      type: object
      required:
        - valid_documents
      properties:
        valid_documents:
          type: array
          items:
            $ref: '#/components/schemas/SupportedDocument'

    IdStatusResponse:
      type: object
      required:
        - last_checked
        - last_check_status
        - last_hour_success_rate
        - last_known_status
        - last_check_success_rate
      properties:
        last_checked:
          type: string
          format: date-time
          description: Timestamp of the most recent uptime check.
          example: '2026-04-14T12:30:00.000Z'
        last_check_status:
          type: string
          enum: [success, failure]
          description: Whether the most recent check succeeded or failed.
          example: success
        last_hour_success_rate:
          type: string
          description: Aggregate success rate over the last hour as a percentage.
          example: '95%'
        last_known_status:
          type: string
          description: The raw status string from the most recent check (e.g. "online", "offline").
          example: online
        last_check_success_rate:
          type: string
          description: Success rate of the most recent individual check as a percentage.
          example: '90%'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Smile Identity error code.

    IdStatusErrorResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Human-readable error message.
        status:
          type: string
          description: HTTP status text (e.g. "Bad Request", "Unauthorized").

paths:
  /v3/services/bank_codes:
    get:
      operationId: getBankCodes
      summary: List bank codes
      description: |
        Returns a list of bank codes supported for bank-account-based identity
        verification. Optionally filtered by country.
      security: []
      parameters:
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: Successful response containing bank codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCodesResponse'
              example:
                bank_codes:
                  - code: '044'
                    country: NG
                    name: Access Bank
                  - code: '023'
                    country: NG
                    name: Citibank
        '403':
          description: Request blocked (IP blocked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: You are not authorized to do that.
                code: '2413'

  /v3/services/supported_id_types:
    get:
      operationId: getSupportedIdTypes
      summary: List supported KYC ID types
      description: |
        Returns a list of all KYC ID types supported for identity verification,
        including their validation regex, required fields, and optional bank code.
        Optionally filtered by country.
      security: []
      parameters:
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: Successful response containing supported ID types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedIdTypesResponse'
              example:
                id_types:
                  - country: NG
                    label: Bank Verification Number
                    regex: '^\d{11}$'
                    required_fields:
                      - first_name
                      - last_name
                      - dob
                    type: BVN
                  - bank_code: '044'
                    country: NG
                    label: Bank Account (Access Bank)
                    regex: '^\d{10}$'
                    required_fields:
                      - first_name
                      - last_name
                    type: BANK_ACCOUNT
        '403':
          description: Request blocked (IP blocked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: You are not authorized to do that.
                code: '2413'

  /v3/services/supported_documents:
    get:
      operationId: getSupportedDocuments
      summary: List supported documents for verification
      description: |
        Returns a list of supported document types for identity verification across all
        countries served by Smile Identity.

        The response can be filtered by continent or country code. An optional `locale`
        parameter controls the language of document names.

        This endpoint does not require authentication. It is an alias of
        `GET /v1/valid_documents` and `GET /v3/valid-documents`.
      security: []
      parameters:
        - name: continent
          in: query
          required: false
          description: Filter results to a single continent.
          schema:
            type: string
            enum:
              - AFRICA
              - ASIA
              - EUROPE
              - 'NORTH AMERICA'
              - OCEANIA
              - 'SOUTH AMERICA'
          example: AFRICA
        - name: country_code
          in: query
          required: false
          description: |
            Filter results to a single country. Must be an ISO 3166-1 alpha-2 code
            (two uppercase letters).
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
          example: NG
        - name: locale
          in: query
          required: false
          description: |
            Locale for document names. Defaults to `en-GB`.
            Supported values: `en-GB`, `fr-FR`, `ar-EG`.
          schema:
            type: string
            default: en-GB
            enum:
              - en-GB
              - fr-FR
              - ar-EG
      responses:
        '200':
          description: List of supported documents, optionally filtered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedDocumentsResponse'
              example:
                valid_documents:
                  - country:
                      code: NG
                      name: Nigeria
                      continent: AFRICA
                    id_types:
                      - code: DRIVERS_LICENSE
                        name: Driver's License
                        example: ['AAA00000AA00']
                        has_back: true
                      - code: NATIONAL_ID
                        name: National ID (NIN Slip)
                        example: ['00000000000']
                        has_back: false
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: >-
                  Country Code must be a valid ISO 3166-1 alpha-2 country code
                  consisting of exactly two uppercase letters.
                code: '2413'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: System Error
                code: '2401'

  /v3/services/id_status:
    get:
      operationId: getIdStatus
      summary: Get ID type availability status
      description: |
        Returns the current availability and success rate for a specific ID type
        in a given country, based on uptime data from the last hour.

        Requires authentication via JWT token.
      security:
        - SmileIDToken: []
      parameters:
        - name: country
          in: query
          required: true
          description: ISO 3166-1 alpha-2 country code or full country name (e.g. "NG" or "Nigeria").
          schema:
            type: string
            example: NG
        - name: id_type
          in: query
          required: true
          description: The ID type code to check status for (e.g. "BVN", "NIN", "VOTER_ID").
          schema:
            type: string
            example: BVN
      responses:
        '200':
          description: ID status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStatusResponse'
              example:
                last_checked: '2026-04-14T12:30:00.000Z'
                last_check_status: success
                last_hour_success_rate: '95%'
                last_known_status: online
                last_check_success_rate: '90%'
        '400':
          description: Bad request – missing or invalid parameters, or no uptime data found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStatusErrorResponse'
              examples:
                missingCountry:
                  summary: Country parameter missing
                  value:
                    message: '"country" is required'
                    status: Bad Request
                invalidCountry:
                  summary: Invalid country value
                  value:
                    message: Invalid country
                    status: Bad Request
                invalidIdType:
                  summary: ID type not valid for country
                  value:
                    message: Invalid id_type for the given country
                    status: Bad Request
                noData:
                  summary: No uptime data in the last hour
                  value:
                    message: 'No data found. Check that NG and BVN are valid inputs'
                    status: Bad Request
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdStatusErrorResponse'
              example:
                message: Invalid token
                status: Unauthorized
