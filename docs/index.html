<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smile ID API Reference</title>
    <meta name="description" content="OpenAPI 3.0 reference for the Smile ID v3 API." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-navy: #151F72;
        --brand-navy-deep: #00065C;
        --brand-blue: #1E40AF;
        --brand-orange: #FF9B00;
        --brand-cream: #F9F0E7;
        --ink: #1F2937;
        --ink-muted: #4A5565;
        --line: rgba(255, 255, 255, 0.08);
        --sidebar-w: 280px;
        --header-h: 64px;
        --font-sans: "Epilogue", ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: var(--font-sans);
        color: var(--ink);
        background: #fff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--header-h);
        background: var(--brand-navy);
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 28px;
        z-index: 10;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
      }
      #header .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.01em;
        text-decoration: none;
        color: #fff;
      }
      #header .wordmark .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--brand-orange);
      }
      #header .subtitle {
        margin-left: 14px;
        padding-left: 14px;
        border-left: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 13px;
        font-weight: 400;
        opacity: 0.78;
      }
      #header .spacer { flex: 1; }
      #header a.external {
        color: rgba(255, 255, 255, 0.78);
        font-size: 13px;
        text-decoration: none;
        margin-left: 20px;
        transition: color 0.15s;
      }
      #header a.external:hover { color: #fff; }

      #app {
        display: flex;
        height: calc(100vh - var(--header-h));
        margin-top: var(--header-h);
      }

      #sidebar {
        width: var(--sidebar-w);
        flex: 0 0 var(--sidebar-w);
        background: var(--brand-navy-deep);
        color: rgba(255, 255, 255, 0.92);
        overflow-y: auto;
        padding: 24px 0 32px;
        font-size: 14px;
        display: flex;
        flex-direction: column;
      }
      #sidebar > ul:last-of-type { margin-bottom: auto; }
      #sidebar h2 {
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 600;
        margin: 0 0 12px;
        padding: 0 24px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      #sidebar ul { list-style: none; margin: 0 0 24px; padding: 0; }
      #sidebar li a {
        display: block;
        padding: 9px 24px;
        color: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-weight: 500;
        border-left: 3px solid transparent;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      #sidebar li a:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }
      #sidebar li a.active {
        background: rgba(255, 255, 255, 0.07);
        color: #fff;
        border-left-color: var(--brand-orange);
        font-weight: 600;
      }
      #sidebar .footer {
        margin-top: auto;
        padding: 20px 24px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.5;
      }
      #sidebar .footer a {
        color: rgba(255, 255, 255, 0.78);
        text-decoration: none;
        border-bottom: 1px dotted rgba(255, 255, 255, 0.3);
      }
      #sidebar .footer a:hover { color: #fff; }

      #content {
        flex: 1;
        overflow: auto;
        background: #fff;
      }

      /* Tighter type inside Redoc to feel native to the wrapper */
      #redoc-container .api-info h1 { font-family: var(--font-sans); }

      @media (max-width: 768px) {
        #app { flex-direction: column; }
        #sidebar { width: 100%; flex: 0 0 auto; max-height: 30vh; }
      }
    </style>
  </head>
  <body>
    <header id="header">
      <a class="wordmark" href="?">
        <span class="dot"></span>
        <span>Smile ID</span>
      </a>
      <span class="subtitle">API Reference</span>
      <div class="spacer"></div>
      <a class="external" href="https://docs.usesmileid.com/" target="_blank" rel="noopener">Documentation</a>
      <a class="external" href="https://www.usesmileid.com/" target="_blank" rel="noopener">usesmileid.com</a>
    </header>

    <div id="app">
      <aside id="sidebar">
        <h2>APIs</h2>
        <ul id="spec-list"></ul>
        <div class="footer">
          OpenAPI 3.0 specs for the Smile ID v3 API.<br />
          See <a href="https://github.com/smileidentity/api-reference">smileidentity/api-reference</a> on GitHub.
        </div>
      </aside>
      <main id="content">
        <div id="redoc-container"></div>
      </main>
    </div>

    <script>
      // <!-- SPEC_LIST_START -->
      const SPECS = [
        { file: "v3-biometric-authentication-entry", label: "Biometric Authentication" },
        { file: "v3-biometric-enrollment-entry", label: "Biometric Enrollment" },
        { file: "v3-biometric-kyc-entry", label: "Biometric KYC" },
        { file: "v3-block-user", label: "Block User" },
        { file: "v3-document-verification-entry", label: "Document Verification" },
        { file: "v3-enhanced-document-verification-entry", label: "Enhanced Document Verification" },
        { file: "v3-enhanced-kyc-entry", label: "Enhanced KYC" },
        { file: "v3-enhanced-kyc-job-status", label: "Enhanced KYC Job Status" },
        { file: "v3-id-status", label: "ID Status" },
        { file: "v3-replay-callback", label: "Replay Callback" },
        { file: "v3-services", label: "Services" },
        { file: "v3-smart-selfie-compare-entry", label: "Smart Selfie Compare" },
        { file: "v3-supported-documents", label: "Supported Documents" },
        { file: "v3-token", label: "Token" }
      ];
      // <!-- SPEC_LIST_END -->

      const params = new URLSearchParams(window.location.search);
      const selected = SPECS.find((s) => s.file === params.get("spec")) || SPECS[0];

      const list = document.getElementById("spec-list");
      for (const spec of SPECS) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `?spec=${encodeURIComponent(spec.file)}`;
        a.textContent = spec.label;
        if (spec.file === selected.file) a.className = "active";
        li.appendChild(a);
        list.appendChild(li);
      }
      document.title = `${selected.label} — Smile ID API Reference`;
    </script>
    <script src="https://cdn.redoc.ly/redoc/v2.4.0/bundles/redoc.standalone.js"></script>
    <script>
      Redoc.init(
        `../specs/v3/${selected.file}.yaml`,
        {
          hideDownloadButton: false,
          expandResponses: "200,201,202",
          nativeScrollbars: true,
          theme: {
            colors: {
              primary: { main: "#151F72" },
              success: { main: "#00A544" },
              warning: { main: "#FF9B00" },
              error: { main: "#FB2C36" },
              text: { primary: "#1F2937", secondary: "#4A5565" },
              http: {
                get: "#1E40AF",
                post: "#00A544",
                put: "#FF9B00",
                delete: "#FB2C36",
                patch: "#C07EFF"
              }
            },
            typography: {
              fontSize: "15px",
              fontFamily:
                '"Epilogue", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
              headings: {
                fontFamily:
                  '"Epilogue", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
                fontWeight: "700"
              },
              code: {
                fontFamily:
                  'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace',
                fontSize: "13px"
              },
              links: { color: "#1E40AF", hover: "#001096" }
            },
            sidebar: {
              width: "240px",
              backgroundColor: "#F9F0E7",
              textColor: "#1F2937"
            },
            rightPanel: { backgroundColor: "#0B0F2C", textColor: "#E2E8F0" }
          }
        },
        document.getElementById("redoc-container")
      );
    </script>
  </body>
</html>
