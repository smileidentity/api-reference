<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smile ID API Reference</title>
    <meta name="description" content="OpenAPI 3.0 reference for the Smile ID v3 API." />
    <!-- Smile ID mark, primary blue -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 34' fill='%23151f72'%3E%3Cpath d='M18.154 16.523H0v16.92h18.154v-16.92z'/%3E%3Cpath d='M22.565 0h-.499c-4.625 0-8.761 3.018-8.761 9.653v6.88h18.103v-6.88C31.408 3.018 27.23 0 22.565 0z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Epilogue:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Smile ID design system tokens (generated; see docs/tokens.css header) -->
    <link rel="stylesheet" href="tokens.css" />
    <style>
      :root {
        --sidebar-w: 264px;
        --header-h: 64px;
        --rail-bg: var(--si-color-primary);
        --rail-fg: var(--si-color-neutral-off-white);
      }
      /* Step the rail down from the header only where color-mix is supported.
         Unguarded, an unsupported browser makes the background declaration
         invalid at computed-value time and the rail loses its fill entirely. */
      @supports (color: color-mix(in srgb, red, blue)) {
        :root { --rail-bg: color-mix(in srgb, var(--si-color-primary) 90%, #000); }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: var(--si-text-style-body-font-family);
        color: var(--si-color-text-body);
        background: var(--si-color-surface);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--header-h);
        background: var(--si-color-primary);
        display: flex;
        align-items: center;
        gap: var(--si-spacing-md);
        padding: 0 var(--si-spacing-lg);
        z-index: 10;
      }
      /* Base colour for both chrome surfaces: everything painted on primary blue
         inherits it, so a dimmed color-mix that fails still lands on legible text. */
      #header, #sidebar { color: var(--si-color-on-primary); }
      #header .wordmark {
        display: flex;
        align-items: center;
        text-decoration: none;
        color: var(--rail-fg);
      }
      #header .wordmark svg { height: 22px; width: auto; display: block; }
      #header .subtitle {
        padding-left: var(--si-spacing-md);
        border-left: 1px solid color-mix(in srgb, var(--rail-fg) 24%, transparent);
        font-size: var(--si-font-size-14);
        font-weight: var(--si-font-weight-medium);
        color: color-mix(in srgb, var(--rail-fg) 82%, transparent);
      }
      #header .spacer { flex: 1; }
      #header a.external {
        color: color-mix(in srgb, var(--rail-fg) 82%, transparent);
        font-size: var(--si-font-size-14);
        font-weight: var(--si-font-weight-medium);
        text-decoration: none;
        padding: 6px var(--si-spacing-sm);
        border-radius: var(--si-radius-control);
        transition: background 0.15s, color 0.15s;
      }
      #header a.external:hover {
        color: var(--rail-fg);
        background: color-mix(in srgb, var(--rail-fg) 12%, transparent);
      }

      #app {
        display: flex;
        height: calc(100vh - var(--header-h));
        margin-top: var(--header-h);
      }

      #sidebar {
        width: var(--sidebar-w);
        flex: 0 0 var(--sidebar-w);
        background: var(--rail-bg);
        overflow-y: auto;
        padding: var(--si-spacing-lg) 0;
        display: flex;
        flex-direction: column;
      }
      #sidebar h2 {
        font-family: var(--si-text-style-overline-font-family);
        font-size: var(--si-text-style-overline-font-size);
        font-weight: var(--si-text-style-overline-font-weight);
        line-height: var(--si-text-style-overline-line-height);
        letter-spacing: var(--si-text-style-overline-letter-spacing);
        text-transform: uppercase;
        margin: 0 0 var(--si-spacing-sm);
        padding: 0 var(--si-spacing-lg);
        color: color-mix(in srgb, var(--rail-fg) 60%, transparent);
      }
      #sidebar ul { list-style: none; margin: 0; padding: 0 var(--si-spacing-sm); }
      #sidebar li a {
        display: block;
        padding: 9px var(--si-spacing-md);
        margin-bottom: 2px;
        border-radius: var(--si-radius-sm);
        color: color-mix(in srgb, var(--rail-fg) 82%, transparent);
        text-decoration: none;
        font-size: var(--si-font-size-14);
        font-weight: var(--si-font-weight-medium);
        transition: background 0.15s, color 0.15s;
      }
      #sidebar li a:hover {
        background: color-mix(in srgb, var(--rail-fg) 8%, transparent);
        color: var(--rail-fg);
      }
      #sidebar li a.active {
        background: color-mix(in srgb, var(--rail-fg) 14%, transparent);
        color: var(--rail-fg);
        font-weight: var(--si-font-weight-semibold);
        box-shadow: inset 3px 0 0 var(--si-color-brand-orange);
      }
      #sidebar .footer {
        margin-top: auto;
        padding: var(--si-spacing-md) var(--si-spacing-lg) 0;
        font-size: var(--si-font-size-12);
        line-height: 1.6;
        color: color-mix(in srgb, var(--rail-fg) 60%, transparent);
      }
      #sidebar .footer a {
        color: color-mix(in srgb, var(--rail-fg) 82%, transparent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #sidebar .footer a:hover { color: var(--rail-fg); }

      #content {
        flex: 1;
        overflow: auto;
        background: var(--si-color-surface);
      }

      /* Redoc overrides for the bits its theme object doesn't reach. Redoc v2.4.0
         has no theme key for border radius, so its controls are styled here.
         Selectors stay on standard attributes — Redoc's own class names are
         generated and change between releases. */
      #redoc-container h1,
      #redoc-container h2,
      #redoc-container h3 { letter-spacing: -0.01em; }
      #redoc-container [role="navigation"] { border-right: 1px solid var(--si-color-border); }
      #redoc-container button[type="submit"] { border-radius: var(--si-radius-control); }

      @media (max-width: 860px) {
        #app { flex-direction: column; height: auto; }
        #sidebar {
          width: 100%;
          flex: 0 0 auto;
          padding: var(--si-spacing-sm) 0;
        }
        /* The heading is redundant once the list reads as a row of chips. The
           footer stays: it holds the only link to the source repo. */
        #sidebar h2 { display: none; }
        #sidebar ul {
          display: flex;
          gap: var(--si-spacing-xs);
          overflow-x: auto;
          padding: 0 var(--si-spacing-md);
          -webkit-overflow-scrolling: touch;
        }
        #sidebar li a {
          white-space: nowrap;
          margin: 0;
          border-radius: var(--si-radius-control);
        }
        #sidebar li a.active { box-shadow: none; }
        #sidebar .footer {
          margin-top: 0;
          padding: var(--si-spacing-sm) var(--si-spacing-md) var(--si-spacing-xs);
        }
      }

      @media (max-width: 560px) {
        #header { padding: 0 var(--si-spacing-md); gap: var(--si-spacing-xs); }
        #header .subtitle { display: none; }
        #header a.external { padding: 6px var(--si-spacing-xs); }
      }
    </style>
  </head>
  <body>
    <header id="header">
      <a class="wordmark" href="?" aria-label="Smile ID home">
        <svg viewBox="0 0 181 34" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M45.314 25.627c.214 1.453 1.273 3.15 4.177 3.15 2.475 0 3.667-.864 3.667-2.287 0-1.422-.835-2.022-2.353-2.205l-5.135-.549c-4.462-.467-7.08-3.038-7.08-7.245 0-4.684 3.555-7.803 10.687-7.803 7.67 0 10.717 3.597 11.012 7.834h-7.202c-.214-1.595-1.528-2.611-3.78-2.611-1.997 0-3.382.731-3.382 2.032 0 1.057.662 1.85 2.404 1.991l4.177.366c5.634.468 7.997 3.15 7.997 7.611 0 4.756-2.975 8.088-11.155 8.088-7.997 0-10.758-4.135-11.125-8.373h7.09zM95.66 22.477V33.38h-7.131V23.229c0-1.484-1.141-2.805-2.618-2.825-2.19-.02-3.118 1.31-3.118 4.166v8.81h-7.019V23.229c0-1.474-1.14-2.805-2.628-2.825-2.19-.03-3.118 1.31-3.118 4.166v8.81h-7.12V15.252h7.12v2.794c1.131-2.103 3.057-3.373 6.072-3.373 3.016 0 5.053 1.422 6.031 3.84 1.172-2.346 3.128-3.84 6.367-3.84 4.91 0 7.162 3.048 7.162 7.804zM99.022 33.38V18.068h7.131v15.314h-7.131zM109.515 33.38V9.277h7.121V33.38h-7.121zM132.416 27.791h7.029c-.692 3.343-3.392 6.178-10.085 6.178-7.702 0-10.32-4.826-10.32-9.684 0-5.222 3.087-9.612 10.32-9.612 7.966 0 10.106 4.857 10.106 9.867a9.19 9.19 0 01-.102 1.554h-13.376c.356 2.327 1.518 3.19 3.525 3.19 1.375 0 2.394-.66 2.903-1.493zm-6.398-5.609h6.724c-.214-1.89-1.12-2.936-3.27-2.936-1.997 0-3.056.762-3.454 2.936zM153.382 33.38h-7.294l.02-24.103h7.264l.01 24.103zM181 21.278c0 6.198-3.667 12.102-11.481 12.102h-12.796V9.277h12.796c7.814 0 11.481 5.792 11.481 12zm-13.193 6.381c3.892 0 5.603-2.174 5.603-6.381 0-4.207-1.782-6.28-5.603-6.28h-3.779V27.66h3.779zM18.154 16.523H0v16.92h18.154v-16.92z"/><path d="M22.565 0h-.499c-4.625 0-8.761 3.018-8.761 9.653v6.88h18.103v-6.88C31.408 3.018 27.23 0 22.565 0zM106.143 9.268h-7.121v7.107h7.121V9.268z"/></svg>
      </a>
      <span class="subtitle">API Reference</span>
      <div class="spacer"></div>
      <a class="external" href="https://docs.usesmileid.com/" target="_blank" rel="noopener">Documentation</a>
      <a class="external" href="https://www.usesmileid.com/" target="_blank" rel="noopener">usesmileid.com</a>
    </header>

    <div id="app">
      <aside id="sidebar">
        <h2>APIs</h2>
        <ul id="spec-list"></ul>
        <div class="footer">
          OpenAPI 3.0 specs for the Smile ID v3 API.<br />
          See <a href="https://github.com/smileidentity/api-reference">smileidentity/api-reference</a> on GitHub.
        </div>
      </aside>
      <main id="content">
        <div id="redoc-container"></div>
      </main>
    </div>

    <script>
      // <!-- SPEC_LIST_START -->
      const SPECS = [
        { file: "openapi", label: "Full V3 API" },
        { file: "v3-biometric-authentication-entry", label: "Biometric Authentication" },
        { file: "v3-biometric-enrollment-entry", label: "Biometric Enrollment" },
        { file: "v3-biometric-kyc-entry", label: "Biometric KYC" },
        { file: "v3-document-verification-entry", label: "Document Verification" },
        { file: "v3-enhanced-document-verification-entry", label: "Enhanced Document Verification" },
        { file: "v3-enhanced-kyc-entry", label: "Enhanced KYC" },
        { file: "v3-one-time-aml-entry", label: "One Time Aml" },
        { file: "v3-replay-callback", label: "Replay Callback" },
        { file: "v3-report-user-fraud", label: "Report User Fraud" },
        { file: "v3-services", label: "Services" },
        { file: "v3-smart-selfie-compare-entry", label: "Smart Selfie Compare" },
        { file: "v3-token", label: "Token" },
        { file: "v3-verification-status", label: "Verification Status" }
      ];
      // <!-- SPEC_LIST_END -->

      const params = new URLSearchParams(window.location.search);
      const selected = SPECS.find((s) => s.file === params.get("spec")) || SPECS[0];

      const list = document.getElementById("spec-list");
      for (const spec of SPECS) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `?spec=${encodeURIComponent(spec.file)}`;
        a.textContent = spec.label;
        if (spec.file === selected.file) a.className = "active";
        li.appendChild(a);
        list.appendChild(li);
      }
      document.title = `${selected.label} — Smile ID API Reference`;
    </script>
    <script src="https://cdn.redoc.ly/redoc/v2.4.0/bundles/redoc.standalone.js"></script>
    <script>
      // Redoc derives tints and shades from these values at runtime, so it needs
      // literal colours rather than var(--si-*). Read them out of the cascade so
      // tokens.css stays the single source of truth and can't drift from this file.
      const style = getComputedStyle(document.documentElement);
      const v = (name) => style.getPropertyValue(name).trim();
      const T = {
        primary: v("--si-color-primary"),
        primaryBright: v("--si-color-brand-blue-bright"),
        cream: v("--si-color-surface-alt"),
        orange: v("--si-color-feedback-warning-fill"),
        orangeBlood: v("--si-color-brand-orange-blood"),
        green: v("--si-color-brand-green"),
        red: v("--si-color-feedback-error-fill"),
        title: v("--si-color-text-title"),
        body: v("--si-color-text-body"),
        border: v("--si-color-border"),
        bodyFont: v("--si-text-style-body-font-family"),
        displayFont: v("--si-text-style-heading-page-font-family"),
        // No monospace token in the design system.
        codeFont:
          'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
      };

      Redoc.init(
        `../specs/v3/${selected.file}.yaml`,
        {
          hideDownloadButton: false,
          expandResponses: "200,201,202",
          nativeScrollbars: true,
          theme: {
            colors: {
              primary: { main: T.primary },
              success: { main: T.green },
              warning: { main: T.orange },
              error: { main: T.red },
              text: { primary: T.title, secondary: T.body },
              border: { light: T.border, dark: T.border },
              http: {
                get: T.primaryBright,
                post: T.green,
                put: T.orange,
                patch: T.orangeBlood,
                delete: T.red
              }
            },
            typography: {
              fontSize: "15px",
              lineHeight: "1.6",
              fontFamily: T.bodyFont,
              headings: { fontFamily: T.displayFont, fontWeight: "700", lineHeight: "1.3" },
              code: { fontFamily: T.codeFont, fontSize: "13px" },
              links: { color: T.primary, hover: T.primaryBright, visited: T.primary }
            },
            sidebar: {
              width: "236px",
              backgroundColor: T.cream,
              textColor: T.title,
              activeTextColor: T.primary,
              groupItems: { textTransform: "uppercase" }
            },
            rightPanel: { backgroundColor: T.primary, textColor: T.cream },
            spacing: { sectionHorizontal: 40, sectionVertical: 24 }
          }
        },
        document.getElementById("redoc-container")
      );
    </script>
  </body>
</html>
